# Fixture do LIVING_THEORY_ENGINE — mistério rural, gênero diferente de romance
# (docs/sdd/LIVING_THEORY_ENGINE_SDD_v0.1.md, 35.2).
#
# "O Sino de Vale Alto": na madrugada seguinte ao enterro do padre Anselmo,
# morto no incêndio da casa paroquial, o sino da capela toca com a torre
# trancada. Duas sementes NEVER (quem/o que tocou o sino; a culpa de Irene) e
# uma pergunta factual com resposta (quem trocou a fechadura).
#
# Slice 2: onze evidências em quatro dos seis capítulos (1, 2, 3, 5), dentro de
# todos os limites padrão — suporte >= 3 e ao menos uma complicação por leitura
# aberta, razão <= 2, >= 3 duplas por pergunta NEVER, <= 2 duplas e <= 3
# evidências por capítulo, 2/11 perceptíveis, 6/11 só de releitura, um red herring.
#
# tests/test_interpretive_canon.py muta CÓPIAS deste runtime em memória. Este
# arquivo precisa continuar sem nenhum achado do validador.
apiVersion: pedroarte.livingbooks/v1
kind: InterpretiveCanon
metadata:
  project_id: living-theory-mvp
  version: 0.2.0
  owner: CANON_GUARDIAN
  refs: {canon_registry: /canon/CANON_REGISTRY.yaml, causal_ledger: /canon/CAUSAL_LEDGER.yaml, visual_canon: null}

policy:
  no_hidden_answer: true
  thresholds: {}

narrators:
  - id: NRL-01
    voice: CHR-IRENE
    scope: "TURN:3"
    unreliability: A memória de Irene sobre a noite do incêndio se contradiz.
    tells: [EVD-06]

questions:
  - id: Q-BELL
    question: Quem ou o que tocou o sino na madrugada do enterro?
    axis: ONTOLOGICAL
    half_life: HIGH
    half_life_rationale: Mesmo sabendo quem tinha a chave, o toque continua compatível com memória falha, acaso e presença.
    resolution_policy: NEVER
    resolved_at: null
    unknown_ref: "CANON:UNK-001"
    prohibited_refs: ["CANON:PRO-001", "CANON:PRO-003"]
    rule_ref: null
    shape: PLURAL
    min_viable_at_end: 2
    ledger_beliefs: [RB-BELL]
    ledger_ground_truths: []
    interpretations:
      - {id: Q-BELL/IRENE, thesis: Irene tocou o sino sem lembrar de ter subido à torre.}
      - {id: Q-BELL/WIND, thesis: O vento e as vigas apodrecidas fizeram o sino soar sozinho.}
      - {id: Q-BELL/DEAD, thesis: O padre Anselmo voltou depois de morto para chamar a vila.}

  - id: Q-GUILT
    question: Irene é culpada pela morte do padre?
    axis: MORAL
    half_life: HIGH
    half_life_rationale: Os gestos de Irene na noite do incêndio sustentam cuidado e abandono ao mesmo tempo.
    resolution_policy: NEVER
    resolved_at: null
    unknown_ref: "CANON:UNK-002"
    prohibited_refs: ["CANON:PRO-002"]
    rule_ref: null
    shape: BINARY
    min_viable_at_end: 2
    ledger_beliefs: [RB-GUILT]
    ledger_ground_truths: [GT-IRENE-01]
    interpretations:
      - {id: Q-GUILT/GUILTY, thesis: Irene deixou a vela acesa sabendo que o padre dormia.}
      - {id: Q-GUILT/INNOCENT, thesis: Irene tentou salvar o padre e carrega uma culpa que não lhe pertence.}

  - id: Q-LOCK
    question: Quem trocou a fechadura da torre?
    axis: FACTUAL
    half_life: LOW
    half_life_rationale: null
    resolution_policy: RESOLVED_AT
    resolved_at: "LEDGER:EV-04"
    unknown_ref: null
    prohibited_refs: []
    rule_ref: null
    shape: BINARY
    min_viable_at_end: null
    ledger_beliefs: []
    ledger_ground_truths: []
    interpretations:
      - {id: Q-LOCK/TOMAS, thesis: Tomás trocou a fechadura da torre.}
      - {id: Q-LOCK/MAYOR, thesis: O prefeito trocou a fechadura da torre.}

partitions:
  - id: Q-BELL~SUPERNATURAL
    of: Q-BELL
    question: Houve algo sobrenatural na capela?
    sides: {"YES": [Q-BELL/DEAD], "NO": [Q-BELL/IRENE, Q-BELL/WIND]}

relations:
  # Se foi o prefeito, havia alguém vivo com a chave: a leitura do padre morto perde necessidade.
  - {from: Q-LOCK/MAYOR, to: Q-BELL/DEAD, kind: EXCLUDES, synthesis: null}
  - {from: Q-GUILT/GUILTY, to: Q-BELL/IRENE, kind: AMPLIFIES,
     synthesis: "A culpa que Irene não admite é a mão que toca o sino."}
  - {from: Q-LOCK/TOMAS, to: Q-BELL/WIND, kind: TENSIONS, synthesis: null}

