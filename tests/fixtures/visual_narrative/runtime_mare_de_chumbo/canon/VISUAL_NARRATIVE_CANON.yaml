elements:
  - id: SIG-LENS
    label: fractured lens
    class: MOTIF
    meaning: "A luz que guia também expõe — a fratura de Marina virada para fora."
    functions:
      - {function: CHARACTER, anchors: ["LEDGER:GT-M-01", "DOC:/specs/SYMBOL_BIBLE.md#motif-1-fractured-lens"]}
      - {function: REVELATION, anchors: ["SCENE:DEBT_NAMED"]}
      - {function: TRANSFORMATION, anchors: ["LEDGER:EV-21"]}
    count: 1
    prominence: DOMINANT
    first_appearance: "TURN:1"
    exposure: {spoiler_level: NONE}
    accessibility:
      monochrome_safe: true
      min_render_size_mm: 8
      text_alternative: "Lente de farol com uma fratura visível, feixe de luz desviado."
    cost_class: ESSENTIAL
    approval: {policy: REQUIRE_APPROVAL, id: null}
    status: PLANNED

  - id: SIG-KNOT
    label: sailor's knot
    class: MOTIF
    meaning: "O nó que prende Tomás à própria dívida de sangue."
    functions:
      - {function: WORLD, anchors: ["CANON:OBJ-LENS", "SCENE:DEBT_NAMED"]}
      - {function: TRANSFORMATION, anchors: ["LEDGER:EV-21"]}
    count: 1
    prominence: SECONDARY
    # LOW, não MEDIUM: o objeto (um nó de marinheiro) não revela por si só
    # QUE dívida é essa nem quem a deve — a revelação (LEDGER:EV-12) é a
    # NOMEAÇÃO da dívida em cena, não a imagem do nó, que é só matéria.
    exposure: {spoiler_level: LOW}
    accessibility:
      monochrome_safe: true
      min_render_size_mm: 8
      text_alternative: "Nó de marinheiro apertado sobre corda gasta."
    cost_class: ESSENTIAL
    approval: {policy: REQUIRE_APPROVAL, id: null}
    status: PLANNED

compositions:
