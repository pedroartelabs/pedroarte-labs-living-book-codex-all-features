  # ---------------------------------------------------------------- §19 dependência cartográfica
  - id: CR-CART-01
    domain: CARTOGRAPHY_DEPENDENCY
    title: "Mapas canônicos como fonte espacial"
    statement: "Os dois mapas aprovados são fonte cartográfica canônica; localidades, rotas, passagens, subsolo, posições, áreas restritas e mistérios cartográficos são respeitados; nenhuma infraestrutura recorrente surge por conveniência sem proposta/atualização cartográfica."
