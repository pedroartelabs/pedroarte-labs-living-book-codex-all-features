    lock: HL-02

  # ---------------------------------------------------------------- §9 P7 Technology Veil
  - id: CR-P7-01
    domain: TECHNOLOGY
    title: "Technology Veil"
    statement: "Categorias PUBLIC, INSTITUTIONAL, HIDDEN, EXTERNAL e FORBIDDEN TECHNOLOGY; Redmur não é tecnologicamente atrasada (eletricidade, água, saneamento, medicina moderna, telecomunicações, logística, informática)."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§9"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P7-02
    domain: TECHNOLOGY
    title: "Paper Face / Digital Shadow"
    statement: "Para o cidadão: papel, carimbo, livro, ficha, documento físico. Nos bastidores: bancos de dados, servidores, backups, indexação, sistemas externos. Não presumir IA central onisciente."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§9.1"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-27
  - id: CR-P7-03
    domain: TECHNOLOGY
    title: "Cofres e tecnologia"
    statement: "Cofres podem ter sensores, ventiladores, identificação passiva e telemetria técnica limitada; Redmur evita vigilância facial indiscriminada e prefere sensores ambientais, identificação mecânica e biometria não facial."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§9.2"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-27

  # ---------------------------------------------------------------- §10 P8 Identity Stack / Tattoo
  - id: CR-P8-01
    domain: IDENTITY
    title: "People recognize. Institutions verify. Forensics prove."
    statement: "Não há substituto único do rosto; o reconhecimento combina voz, marcha, movimento, mãos, postura, altura, proporções, cheiro, respiração, roupa, cofre, hábitos e contexto (Faceless Literacy, falível). Impersonation temporária é possível; roubar cofre não transforma alguém em outra pessoa."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§10"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P8-02
    domain: IDENTITY
    title: "Coffer Civic Seal"
    statement: "Cofres permanentes têm identificação institucional; COFFER_IDENTITY ≠ PERSON_IDENTITY; procedimentos sensíveis podem usar autenticação multifator não facial."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§10.1"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-24
  - id: CR-P8-03
    domain: TATTOO
    title: "Dermal Identity Layer"
    statement: "Redmur desenvolveu cultura sofisticada de tatuagens (rituais, animais, luas, relíquias, religião, profanação, sexualidade adulta, histórias, passado, enigmas, pertencimento, mentiras)."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§10.2"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P8-04
    domain: TATTOO
    title: "Combination Tattoos — BODY = INFORMATION, BODY ≠ TRUTH"
    statement: "Números explícitos não são solução artística de combinações; combinações podem ser sugeridas por símbolos, luas, animais, objetos, padrões, relações e imagens; nenhuma tatuagem representa rosto humano individualizado/reconstruível; leituras variam por observador e contexto."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§10.3"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-19

  # ---------------------------------------------------------------- §11 P9 Economy / Body Gap
  - id: CR-P9-01
    domain: ECONOMY
    title: "Economia semipermeável"
    statement: "Redmur não é autossuficiente: usa libra esterlina, banco britânico, tributação, contratos, importação, exportação e logística; produz parte relevante de alimentos, agricultura, artesanato, couro, metal, madeira, tailoring e manutenção; importa medicamentos, equipamentos, combustível, componentes, tecnologia, veículos e industriais."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§11"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P9-02
    domain: ECONOMY
    title: "Coffermaking, tattoo economy, Manfred Estate Network"
    statement: "Coffermaking é indústria estratégica (cofres fabricados, mantidos, restaurados, herdados, modernizados, não descartáveis); tatuadores têm grande prestígio e a arte pode ter reputação externa; Manfred mantém patrimônio (terras, leases, imóveis, trusts, propriedades agrícolas, participações) sem soberania."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§11.1, §11.2, §11.3"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P9-03
    domain: ECONOMY
    title: "Information Market"
    statement: "Existe mercado negro em que informação pode valer mais que dinheiro; mercadorias clandestinas possíveis: combinação, Facial Record, arquivo, registro infantil, documento antigo, identidade. Facial Records clandestinos são raros, perigosos e difíceis de autenticar."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§11.4"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-05
  - id: CR-P9-BODYGAP
    domain: BODY
    title: "The Redmur Body Gap"
    statement: "BODY_CULTIVATION_PRESSURE = TRUE; BODY_UNIFORMITY = FALSE; BODY_DISPARITY = OBSERVABLE; SINGLE_CAUSE = FALSE; corpos cultivados convivem com corpos comuns, envelhecidos, cicatrizados, deteriorados, assimétricos; causas mundanas possíveis; distribuição completa ainda inexplicada."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§11.5"}
    scope: {book: SERIES, reader: OPEN}

  # ---------------------------------------------------------------- §12 P10 Blind Chronology
  - id: CR-P10-01
    domain: CHRONOLOGY
    title: "Blind Chronology"
    statement: "P10 do Livro 1 é P10-A BLIND CHRONOLOGY; True Chronology é reservada para Livro 2/futuro."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§12"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P10-02
    domain: CHRONOLOGY
    title: "The Redmur Black Interval"
    statement: "Aproximadamente quarenta anos perderam continuidade, não documentos: existem cartas, registros, recibos, mortes, nascimentos, atas, objetos. Causa desconhecida; apagamento deliberado e ator único não confirmados; Aquele Dia, Manfred, Flarry, a criança perdida, cofres, Preservation Act e Six-Month Protocol orbitam o intervalo sem ordem causal definida."
    interval: {approx_years: 40, start: UNKNOWN, end: UNKNOWN}
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§12.1"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P10-03
    domain: ARCHIVE
    title: "Four Archives of Redmur"
    statement: "PAPER (o que instituições registraram), STONE (arquitetura, túmulos, edifícios, cofres, objetos), BODY (tatuagens, cicatrizes, corpos), VOICE (o que gerações repetiram). Nenhum arquivo é soberano."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§12.2"}
    scope: {book: SERIES, reader: OPEN}
  - id: CAP-DEAD-ARCHIVE
    domain: ARCHIVE
    title: "The Dead Archive (capacidade)"
    statement: "Mortos podem funcionar como arquivos involuntários; tatuagens podem sobreviver a documentos; túmulos podem preservar corpo, símbolos, cofres e informação material. Não autoriza exumação nem resolver os quarenta anos no Livro 1."
    status: SYSTEM_CAPABILITY
    epistemic_class: FACT
    system_capability_only: true
    instances: []
    source: {id: SRC-DOSSIER, location: "§12.3"}
    scope: {book: SERIES, reader: OPEN}

  # ---------------------------------------------------------------- §13 P11 Manfred
  - id: CR-P11-01
    domain: MANFRED
    title: "Power without a throne"
    statement: "Os Manfred não governam formalmente Redmur, não têm soberania e não controlam automaticamente Police Scotland, OCP, tribunais ou instituições; seu poder é gravidade estrutural herdada; distinguir LEGAL POWER, INSTITUTIONAL INFLUENCE e CULTURAL DEFERENCE; um Manfred pode ouvir não."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§13"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P11-02
    domain: MANFRED
    title: "Manfred ≠ Manfreds"
    statement: "A família não é mente coletiva: há facções, gerações, ricos, pobres, reformistas, tradicionalistas, afastados e conflitos; pode haver Manfred sem poder e não-Manfred com enorme influência na rede."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§13.1"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P11-03
    domain: MANFRED
    title: "Information Rule"
    statement: "Não existe Manfred que saiba tudo o que os Manfred sabem; arquivos familiares têm lacunas, mentiras, interpretações e documentos perdidos."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§13.2"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P11-04
    domain: MANFRED
    title: "No Universal Manfred Conspiracy"
    statement: "Nunca usar os Manfred como explicação automática; sempre qual Manfred, quando, com quais evidências. A hipótese de que Manfred apagou os quarenta anos continua tentadora e coexiste com alternativas."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§13.3"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-15

  # ---------------------------------------------------------------- §14 P12 1% / Selka
  - id: CR-P12-01
    domain: NON_HUMAN
    title: "The 1% Non-Human Rule"
    statement: "O 1% não humano é resíduo epistemológico, não sobrenatural: RATIONAL, AMBIGUOUS (duas ou mais explicações humanas), RESIDUAL (detalhe sem explicação completa). RESIDUAL ≠ SUPERNATURAL; não usar em toda cena; sem retcon sobrenatural."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§14.1"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-03
  - id: ENT-SELKA
    domain: SELKA
    entity_kind: HISTORICAL_PERSON
    title: "Madre Selka"
    statement: "Mulher real; viveu em Redmur; freira; viveu durante os Missing Forty Years; teve vida privada clandestina parcialmente incompatível com a identidade religiosa pública (PUBLIC_SELKA ≠ PRIVATE_SELKA); morreu em Redmur ou em circunstâncias diretamente ligadas à cidade; tinha tatuagens."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§14.2, §14.3, §14.7"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-14
  - id: CR-P12-02
    domain: SELKA
    title: "Tradições sobre o túmulo e a sepultura que falta"
    statement: "Existe tradição persistente sobre o túmulo perdido de Selka; reconstruções funerárias sugerem diferença entre sepultamentos registrados e sepulturas reconciliáveis (folclore: A Sepultura Que Falta); circulam listas das 10 Relíquias em que o túmulo aparece em versões importantes."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§14.4, §14.5, §14.6"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P12-03
    domain: SELKA
    title: "Selka Ontology Firewall"
    statement: "O destino pós-morte de Selka em outra obra não pode explicar Redmur, confirmar magia, criar fantasma, causar The Pull, mover objetos ou solucionar mistérios; nenhuma obra depende da outra; não explicar didaticamente."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§14.8"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-14

  # ---------------------------------------------------------------- §15 P13 expressão / pescoço / toque
  - id: CR-P13-01
    domain: EXPRESSION
    title: "Feel → Observe → Infer"
    statement: "O rosto existe fisicamente; a narrativa não recebe acesso visual automático. O POV narra sensações internas próprias; outro personagem não observa objetivamente o que o cofre esconde e usa voz, mãos, postura, corpo, distância, respiração, som do cofre, tatuagens, roupa, toque e contexto. 'Pareceu sorrir' é permitido; 'ele sorriu para ela' como observação objetiva sem acesso é proibido."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§15.1"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P13-02
    domain: EXPRESSION
    title: "No Gesture Loop"
    statement: "Não substituir expressão facial por poucos tiques repetitivos; não escrever rosto convencional e traduzir para corpo; personagens importantes podem ter assinaturas não faciais consistentes, sem exagero."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§15.2"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P13-03
    domain: INTIMACY
    title: "The Naked Neck"
    statement: "NECK_VISIBILITY = ALLOWED; NECK ≠ FACE; em contexto adulto o pescoço é zona de vulnerabilidade e erotismo; cobri-lo é costume, não lei; decotes são permitidos; pescoço, decote e tatuagem nunca implicam consentimento."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§15.3"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-08
  - id: CR-P13-R10
    domain: CONSENT
    title: "Layered Contextual Touch Grammar"
    statement: "O significado de tocar um cofre depende de zona, pressão, duração, intenção, consentimento, relação e contexto; toque não é automaticamente sexual nem ilegal; manipulação não autorizada do lock é violação grave; CONSENT_TO_COFFER_TOUCH ≠ CONSENT_TO_LOCK_MANIPULATION ≠ CONSENT_TO_REMOVAL ≠ CONSENT_TO_FACIAL_EXPOSURE; sem dicionário gestual."
    status: CANON_PATCH_APPROVED
    patch: R10
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§15.4"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-08
  - id: CR-P13-R11
    domain: AGE
    title: "Adult-Only Semantic Firewall"
    statement: "Semântica erótica de menores absolutamente desabilitada; status adulto é necessário, não suficiente. Hard consent locks: pescoço exposto, decote, toque de cofre, conhecimento de combinação, acesso ao lock, autoridade, medo e coerção não são consentimento. Toque médico, técnico, parental e pediátrico é eroticamente neutro; violência não é automaticamente erótica."
    status: CANON_PATCH_APPROVED
    patch: R11
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§15.5"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-06
  - id: CR-P13-04
    domain: CONSENT
    title: "Arquitetura de intimidade"
    statement: "IDENTITY (cofre/rosto), ACCESS (lock/combinação), BODY (pescoço/decote/postura) e CONSENT (camada independente): IDENTITY ≠ ACCESS ≠ BODY ≠ CONSENT; INTIMACY ≠ SEXUALITY; VIOLENCE ≠ DESIRE."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§15.6"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-08

