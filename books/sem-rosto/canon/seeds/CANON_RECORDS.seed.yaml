# CANON_RECORDS — registros canônicos de SEM ROSTO (SDD SEM_ROSTO_CANONICAL_STORY_SYSTEM, seções 12–14).
#
# Cada registro APONTA para o dossiê congelado (source.location = §N[.N]); `statement` é uma
# formulação operacional curta, nunca substituta do texto do dossiê. Em caso de dúvida, vale o dossiê.
#
# Tipos por prefixo: CR-* regra/fato · CAP-* capacidade do sistema (nunca instância) ·
# UNK-SR-* incógnita (SEM conteúdo) · PRO-SR-* inferência proibida · ENT-/INST-/FAM-* entidade.
# THEORY-*, RUM-* e MYS-* entram no Slice 2 (RUMORS, MYSTERIES).
#
# Nenhuma chave de resposta (truth, answer, verdade, …) em nível algum.
apiVersion: pedroarte.livingbooks/v1
kind: SemRostoCanonRecords
metadata:
  project_id: sem-rosto
  version: 0.1.0
  owner: CANON_GUARDIAN
  source: ../sources/SOURCES.yaml
  approval: null                # approvals/CANON_SEEDS_<n>.md (humano) com subject_sha256 deste arquivo

records:
  # ---------------------------------------------------------------- §0–§1 princípios absolutos
  - id: CR-ABS-00
    domain: ABSOLUTE
    title: "SYSTEM_CAPABILITY ≠ CANONICAL_INSTANCE"
    statement: "Nenhuma possibilidade técnica, exemplo ou stress test torna-se fato histórico sem aprovação humana."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§0, §23"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-05
  - id: CR-ABS-01
    domain: ABSOLUTE
    title: "Redmur não é o mundo"
    statement: "Redmur é uma pequena cidade fictícia do interior da Escócia; Escócia, Reino Unido e o mundo são contemporâneos; Redmur não é soberana nem representa a humanidade."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§1.1"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-10
  - id: CR-ABS-02
    domain: TECHNOLOGY
    title: "Modern function. Ancient interface."
    statement: "Redmur mantém interface social, administrativa e estética antiga e pode usar tecnologia contemporânea institucional, escondida ou absorvida pela cultura local."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§1.2"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-ABS-03
    domain: ABSOLUTE
    title: "Regra sobrenatural"
    statement: "SUPERNATURAL_CANON = FALSE; MAGICAL_CAUSALITY = FORBIDDEN; UNKNOWN ≠ SUPERNATURAL. Rumores, vultos, coincidências e impressões podem existir; entidades sobrenaturais causais não. Sem retcon sobrenatural futuro."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§1.3"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-01
  - id: CR-ABS-04
    domain: FACE
    title: "Regra absoluta do rosto"
    statement: "O leitor nunca recebe rosto humano identificável/reconstruível; CHARACTER_SEES = TRUE não implica READER_SEES = TRUE. Vale para rosto real, foto, vídeo, desenho, pintura, reflexo, escultura, molde, 3D, IA e composição acima do threshold."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§1.4"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-04
  - id: CR-ABS-05
    domain: MYSTERY
    title: "Regra do mistério"
    statement: "Mistério é informação cuja relação ainda não foi revelada, nunca ausência de planejamento; as verdades maiores têm estrutura interna mesmo escondidas."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§1.5"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-ABS-06
    domain: ABSOLUTE
    title: "Regra de humanidade"
    statement: "O horror de Redmur se sustenta em seres humanos, instituições, memória, desejo, burocracia, tradição, desigualdade, segredo, medo e poder; quando o comportamento humano basta, não se recorre ao sobrenatural."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§1.6"}
    scope: {book: SERIES, reader: OPEN}

  # ---------------------------------------------------------------- §2 P0 Coffer Mechanics
  - id: CR-P0-01
    domain: COFFER
    title: "The head is inside the coffer"
    statement: "A cabeça está dentro do cofre; a cabeça não carrega o cofre. O cofre não é caixa maciça sustentada pelo pescoço."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§2.1"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-21
  - id: CAP-COF-COMPONENTS
    domain: COFFER
    title: "Componentes possíveis do cofre"
    statement: "O sistema pode usar os componentes listados; um cofre específico só tem os componentes que o canon lhe atribuir."
    components: [INTERNAL_FRAME, EXTERNAL_SHELL, SHOULDER_YOKE, LOAD_DISTRIBUTION, ROTATING_COLLAR,
                 PASSIVE_VENTILATION, ACTIVE_VENTILATION, OPTICAL_LABYRINTH, ACOUSTIC_CHANNELS, VOICE_GRILLE,
                 FEEDING_DRAWER, DRAINAGE_HYGIENE, SERVICE_COWL, EMERGENCY_SYSTEMS, SEALS, MAINTENANCE_FITTING,
                 SENSORS, FANS, PASSIVE_ID, LIMITED_TELEMETRY]
    mandatory: [PASSIVE_VENTILATION]
    status: SYSTEM_CAPABILITY
    epistemic_class: FACT
    system_capability_only: true
    instances: []
    source: {id: SRC-DOSSIER, location: "§2.1, §9.2"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-05
  - id: CR-P0-02
    domain: COFFER
    title: "Sobrevivência não depende só de energia"
    statement: "A sobrevivência do usuário não pode depender exclusivamente de bateria ou energia elétrica; a segurança fundamental não depende exclusivamente de eletrônica."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§2.1, §9.2"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-21
  - id: CR-P0-03
    domain: COFFER
    title: "Service Cowl"
    statement: "Mecanismo que permite descobrir fisicamente o rosto em espaço visualmente protegido (higiene, manutenção, cuidados pessoais, procedimentos médicos autorizados): FACIAL_UNCOVERING sem FACIAL_EXPOSURE."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§2.2"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P0-04
    domain: COFFER
    title: "Emergency Breach"
    statement: "Existe procedimento emergencial de abertura; pode exigir ruptura irreversível de selos e protocolos extraordinários."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§2.3"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P0-05
    domain: COFFER
    title: "Sem combinação universal"
    statement: "Não existe combinação universal simples capaz de abrir todos os cofres."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§2.3"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-23
  - id: CR-P0-06
    domain: COFFER
    title: "Dual Authorization"
    statement: "Procedimentos críticos (fitting, manutenção, emergência, instalação) podem exigir dois profissionais/autorizadores."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§2.4"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P0-07
    domain: COFFER
    title: "Estratificação predominante"
    statement: "Classes predominantes: A Helmet, B Shoulder (padrão cívico), C Torso Cage (custódia/contenção), D Dual-Shell (elite; carcaças herdáveis e modernizáveis). Não é casta jurídica rígida."
    classes: [CLS-A-HELMET, CLS-B-SHOULDER, CLS-C-TORSO-CAGE, CLS-D-DUAL-SHELL]
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§2.5"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P0-08
    domain: COFFER
    title: "Coffer Heraldry — COFFER ≠ PERSON"
    statement: "Material, acabamento, bordas, fechos, rebites, formato e desgaste comunicam classe, instituição, tradição, família e geração; o cofre não prova sozinho identidade individual."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§2.6"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-24
  - id: CR-P0-R1
    domain: COFFER
    title: "Combination ≠ Removal Authority"
    statement: "KNOWING_COMBINATION ≠ PERMISSION_TO_TOUCH ≠ PERMISSION_TO_MANIPULATE_LOCK ≠ REMOVAL_AUTHORITY ≠ FACIAL_EXPOSURE_PERMISSION. A combinação é camada de acesso pessoal (confiança, intimidade, chantagem, informação), não entrega do rosto."
    status: CANON_PATCH_APPROVED
    patch: R1
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§2.7"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-07
  - id: CR-P0-R5
    domain: COFFER
    title: "Permanent Requirement ≠ Permanent Hardware"
    statement: "A obrigação de proteção facial pode ser permanente sem a mesma peça física a vida toda (crescimento, substituição, fitting, manutenção, medicina, emergência). PEDIATRIC_ACCESS = CLINICAL / PROTECTIVE / FUNCTIONAL; nunca presumir erotismo."
    status: CANON_PATCH_APPROVED
    patch: R5
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§2.8"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-26

  # ---------------------------------------------------------------- §3 P1 Facial Exposure Law
  - id: CR-P1-01
    domain: FACE
    title: "Facial Uncovering"
    statement: "O rosto fisicamente descoberto não é crime por si só."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§3.1"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P1-02
    domain: FACE
    title: "Facial Exposure = crime"
    statement: "Há exposição quando informação visual suficiente do rosto fica acessível a terceiro de modo a permitir recuperar representação facial individualizada. A classificação independe da intenção; responsabilidade e gravidade dependem de contexto."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§3.2"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P1-03
    domain: FACE
    title: "Facial Record"
    statement: "Representação reconstruível preservada (foto, vídeo, desenho, pintura, arquivo digital, gravação, escultura, molde, 3D, IA, composição de fragmentos). Registro facial reconstruível não autorizado é ofensa."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§3.3"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P1-R9
    domain: FACE
    title: "Functional Reconstructibility Threshold"
    statement: "Teste: o material, isolado ou razoavelmente combinável, permite recuperar representação facial coerente e individualizada? Estados NON_RECONSTRUCTIBLE, PARTIALLY_FACIAL, RECONSTRUCTIBLE_FACE; percentual e contagem de traços não decidem sozinhos; fragmentos podem ultrapassar o threshold em conjunto; NECK = NOT FACE."
    status: CANON_PATCH_APPROVED
    patch: R9
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§3.4"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P1-R6
    domain: FACE
    title: "Sealed Facial Evidence — requisitos e proibições"
    statement: "Captura facial necessária em contexto médico, forense, autópsia ou judicial exige necessidade, exposição mínima, autoridade de captura autorizada, cadeia de custódia, limitação de finalidade, acesso controlado e registro de acesso. Proibidos: banco geral de reconhecimento facial, thumbnails faciais, acesso público, uso geral da OCP para captura. Cópias derivadas mantêm a proteção."
    status: CANON_PATCH_APPROVED
    patch: R6
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§3.5"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-12
  - id: CAP-SEALED-FACIAL-EVIDENCE
    domain: FACE
    title: "Sealed Facial Evidence (capacidade)"
    statement: "A categoria existe; nenhuma peça específica existe sem canon explícito (nem de Selka, Manfred, protagonistas, Missing Forty Years, Aquele Dia ou qualquer arquivo)."
    status: SYSTEM_CAPABILITY
    epistemic_class: FACT
    system_capability_only: true
    instances: []
    source: {id: SRC-DOSSIER, location: "§3.5, §23"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-05
  - id: CR-P1-R7
    domain: FACE
    title: "Outside Facial Records"
    statement: "Redmur regula exposição facial local, não a existência global de rostos: LAWFUL_EXTERNAL_EXISTENCE ≠ LAWFUL_LOCAL_POSSESSION ≠ LAWFUL_LOCAL_EXPOSURE. Sem autoridade global de exclusão; o Returner não apaga a vida anterior; documentos externos permanecem válidos."
    status: CANON_PATCH_APPROVED
    patch: R7
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§3.6"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-13
  - id: CAP-EXTERNAL-FACIAL-RECORD
    domain: FACE
    title: "Registro facial externo (capacidade)"
    statement: "Registros faciais externos podem existir legalmente; nenhum registro externo específico existe sem canon explícito."
    status: SYSTEM_CAPABILITY
    epistemic_class: FACT
    system_capability_only: true
    instances: []
    source: {id: SRC-DOSSIER, location: "§3.6, §23"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-05
  - id: CR-R8-01
    domain: FACE
    title: "NO_DELIBERATE_SELF_VIEWING"
    statement: "O tabu protege o rosto dos outros e da própria pessoa: ver deliberadamente o próprio rosto é proibido."
    status: CANON_PATCH_APPROVED
    patch: R8
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§3.7"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-11
  - id: CR-R8-02
    domain: FACE
    title: "Encontro acidental com o próprio rosto"
    statement: "Encontrar acidentalmente o próprio rosto não é crime por si só."
    status: CANON_PATCH_APPROVED
    patch: R8
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§3.7"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-R8-03
    domain: FACE
    title: "Memória e toque do próprio rosto"
    statement: "Memória facial própria é permitida; tocar o próprio rosto é permitido."
    status: CANON_PATCH_APPROVED
    patch: R8
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§3.7"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-R8-04
    domain: FACE
    title: "Espelhos em Redmur"
    statement: "Espelhos comuns capazes de reproduzir rosto reconstruível não são normais em Redmur; o desenho permite o corpo e mantém a área facial abaixo do threshold (fosqueamento, oxidação, distorção, gravação, interrupção, opacidade ou equivalente)."
    status: CANON_PATCH_APPROVED
    patch: R8
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§3.7"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-R8-05
    domain: FACE
    title: "Memória visual do próprio rosto por origem"
    statement: "Quem é residente desde a infância pode crescer sem memória visual útil do próprio rosto; um Adult Returner pode conservar memória anterior."
    status: CANON_PATCH_APPROVED
    patch: R8
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§3.7"}
    scope: {book: SERIES, reader: OPEN}

  # ---------------------------------------------------------------- §4 P2 Six-Month Child Protocol
  - id: CR-P2-01
    domain: CHILD_PROTOCOL
    title: "Neonatal Facial Exemption"
    statement: "Em curta janela pós-parto os pais podem conhecer visualmente o recém-nascido e lembrar; FACIAL_RECORD continua proibido."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§4.1"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P2-02
    domain: CHILD_PROTOCOL
    title: "Transfer, custódia e Child Bulletins"
    statement: "Após estabilização clínica ocorre TRANSFER; a criança fica sob custódia institucional por aproximadamente seis meses, sem visitas presenciais regulares; os pais recebem Child Bulletins (saúde, peso, alimentação, desenvolvimento, fitting, retorno)."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§4.2"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P2-03
    domain: CHILD_PROTOCOL
    title: "The Return"
    statement: "Aos aproximadamente seis meses a criança retorna usando o primeiro sistema de proteção facial apropriado à idade; a obrigação é permanente, o hardware não."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§4.3"}
    scope: {book: SERIES, reader: OPEN}
  - id: CAP-INFANT-STAGES
    domain: CHILD_PROTOCOL
    title: "Infant Veil → Infant Frame → First Coffer (capacidade)"
    statement: "A adaptação pode ocorrer progressivamente por estágios funcionais; o desenho pediátrico prioriza segurança clínica e desenvolvimento, nunca miniaturização de cofre adulto. Nenhuma criança específica passa por estágios não canonizados."
    stages: [INFANT_VEIL, INFANT_FRAME, FIRST_COFFER]
    status: SYSTEM_CAPABILITY
    epistemic_class: FACT
    system_capability_only: true
    instances: []
    source: {id: SRC-DOSSIER, location: "§4.4"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P2-R4
    domain: CHILD_PROTOCOL
    title: "Facility Visibility ≠ Protocol Transparency"
    statement: "O local do protocolo pode ser fisicamente conhecido, localizado e institucionalmente visível; o mistério não depende de prédio secreto. O local pertence à cartografia canônica existente."
    status: CANON_PATCH_APPROVED
    patch: R4
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§4.6"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-25
  - id: CR-P2-R3
    domain: JURISDICTION
    title: "Eligibility ≠ Extraterritorial Enforcement"
    statement: "Redmur pode estabelecer elegibilidade e condições cívicas; isso não cria poder policial fora de Redmur. A OCP não é polícia internacional; Redmur não é Estado soberano."
    status: CANON_PATCH_APPROVED
    patch: R3
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§4.7"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-10
  - id: CR-P2-R11
    domain: AGE
    title: "Child Semantic Firewall"
    statement: "MINOR_EROTIC_SEMANTICS = ABSOLUTELY_DISABLED. O protocolo é pediátrico, clínico e cívico; nenhuma semântica adulta de pescoço, cofre, lock, combinação, roupa ou toque se transfere para bebês, crianças, cuidado parental ou pediátrico."
    status: CANON_PATCH_APPROVED
    patch: R11
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§4.8"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-06

  # ---------------------------------------------------------------- §5 P3 Visitor Protocol
  - id: CR-P3-01
    domain: VISITOR
    title: "Preservation Boundary"
    statement: "Redmur não tem fronteira internacional; existe uma Preservation Boundary como área regulamentada de acesso."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§5"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-DEC-05B
    domain: VISITOR
    title: "Preservation Boundary = limite do District of Civic Preservation"
    statement: "A Preservation Boundary é o limite do District of Civic Preservation (BND-ADM-CP do Mapa A); extensão desconhecida; a legenda do mapa continua alegação oficial."
    map_refs: [BND-ADM-CP]
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: APPROVAL:CANON_DECISION_0001, location: "OQ-SR-05b"}
    depends_on: [CR-P3-01]
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P3-02
    domain: VISITOR
    title: "Veil House e Visitor Coffer"
    statement: "Visitantes entram por instalação intermediária sem exposição direta aos habitantes e recebem Visitor Coffer temporário, que comunica OUTSIDER (não casta); instalação e remoção podem ocorrer em fitting chamber privada; quem recusa simplesmente não entra."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§5.1"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P3-03
    domain: VISITOR
    title: "Tecnologia do visitante"
    statement: "Dispositivos visuais podem ser lacrados, armazenados ou limitados; não há obrigação geral de apagá-los; documentos fotográficos usam protocolo de ocultação facial."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§5.2"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P3-04
    domain: VISITOR
    title: "Categorias externas, Transfer Zone e autoridades"
    statement: "Turistas, jornalistas, profissionais externos, familiares, autoridades e prestadores entram sob protocolos próprios; mercadorias podem usar Transfer Zone; Police Scotland, bombeiros, paramédicos e autoridades competentes mantêm seus poderes; emergências podem sobrepor o protocolo local; crianças visitantes não entram no Six-Month Protocol; entrada acidental prioriza proteção e correção, não punição automática."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§5.3"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-DEC-05C
    domain: VISITOR
    title: "Veil House e Transfer Zone fora dos mapas"
    statement: "Veil House e Transfer Zone ficam na Preservation Boundary e não estão desenhadas nos mapas; a posição é desconhecida; não entram no grafo nem em rotas sem decisão cartográfica."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: APPROVAL:CANON_DECISION_0001, location: "OQ-SR-05c"}
    depends_on: [CR-P3-02, CR-P3-04, CR-DEC-05B]
    scope: {book: SERIES, reader: OPEN}

  # ---------------------------------------------------------------- §6 P4 Returner / Open Gate
  - id: CR-P4-01
    domain: RETURNER
    title: "Categorias cívicas"
    statement: "Categorias: VISITOR, RETURNER, RESIDENT, BORN-REDMUR, OFFICIAL, OUTSIDER CONTRACTOR."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§6"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P4-02
    domain: RETURNER
    title: "Physical Departure ≠ Civic Release"
    statement: "Sair fisicamente não resolve o vínculo cívico; estados ACTIVE, DEPARTED, RELEASED, RETURNER; nascimento em Redmur não cria obrigação eterna absoluta."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§6.1"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P4-R2
    domain: RETURNER
    title: "Physical Return ≠ Civic Reactivation"
    statement: "Retornar fisicamente não ativa automaticamente o regime de Returner: PHYSICAL_PRESENCE ≠ AUTOMATIC_RETURNER_ACTIVE_STATUS. Distinguir visitante, pessoa fisicamente retornada, pessoa elegível e Returner reativado; a reativação depende de processo institucional; passar pela fronteira não muda status."
    status: CANON_PATCH_APPROVED
    patch: R2
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§6.2"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-09
  - id: CR-P4-03
    domain: RETURNER
    title: "Return Acceptance / Civic Reactivation"
    statement: "O Returner reativado volta às regras de Facial Preservation e recebe cofre individual permanente, não Visitor Coffer; a instalação pode envolver dual authorization, medidas, fitting, stabilization, ventilação, locking, sealing e mobility test; sedação não é rotina."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§6.3"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P4-04
    domain: RETURNER
    title: "Civic Release"
    statement: "Existe mecanismo de desvinculação cívica; sair fisicamente e obter release completo são processos distintos."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§6.4"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P4-05
    domain: RETURNER
    title: "Open Gate Paradox"
    statement: "Visitors may leave. Outsiders may leave. They simply tend not to. A liberdade de sair é real; muitos ficam voluntariamente; a razão completa é mistério."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§6.5"}
    scope: {book: SERIES, reader: OPEN}

  # ---------------------------------------------------------------- §7 P5 Redmur × Reino Unido
  - id: CR-P5-01
    domain: JURISDICTION
    title: "Palimpsest Jurisdiction"
    statement: "Redmur integra Escócia e Reino Unido; o Reino Unido sabe que Redmur existe; a cidade não é secreta. Uma antiga carta real isolada não explica a autoridade contemporânea."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§7"}
    scope: {book: SERIES, reader: OPEN}
    lock: HL-10
  - id: CR-P5-ACT
    domain: JURISDICTION
    title: "Redmur Preservation Act"
    statement: "Instrumento ficcional central concebido como antigo Local/Private Act de Westminster; regularizou práticas preexistentes e criou estrutura estatutária específica."
    name_status: PROVISIONAL
    date: UNKNOWN
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§7.1"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P5-OCP
    domain: JURISDICTION
    title: "Office of Civic Preservation — competências"
    statement: "A OCP é statutory preservation body, não prefeitura. Normal Scotland: impostos, tribunais, polícia, NHS, serviços, legislação geral. Preservation Redmur: facial preservation, cofres, fittings, registros específicos, visitantes, returners, protocolos determinados."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§7.2"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P5-SAVINGS
    domain: JURISDICTION
    title: "Savings Clause Horror"
    statement: "Reformas sucessivas preservaram a anomalia por cláusulas equivalentes a savings clauses; a pergunta canônica é por que gerações do sistema britânico a encontraram e preservaram parte dela."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§7.3"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P5-POLICE
    domain: JURISDICTION
    title: "Justiça e polícia"
    statement: "Police Scotland mantém jurisdição; COPFS mantém competência criminal; tribunais escoceses continuam válidos; Redmur Constabulary atua como wardens/civic security/preservation officers de competência limitada."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§7.4"}
    scope: {book: SERIES, reader: OPEN}
  - id: CR-P5-STATE-KNOWS
    domain: JURISDICTION
    title: "O Estado sabe do Six-Month Protocol"
    statement: "O Estado sabe que o sistema existe; não é masmorra secreta; pode haver inspeção, regulação, licenciamento e estruturas médicas. O mistério é a finalidade completa e o que ocorre internamente."
    status: CANON_APPROVED
    epistemic_class: FACT
    source: {id: SRC-DOSSIER, location: "§7.5"}
    scope: {book: SERIES, reader: OPEN}

  # ---------------------------------------------------------------- §8 P6 The Pull
  - id: CR-P6-01
    domain: PULL
    title: "The Pull é multicausal"
    statement: "Não existe força mágica que impeça pessoas de sair; The Pull é fenômeno social, perceptivo e cultural multicausal."
    components: [ANONYMITY_RELIEF, FORBIDDEN_INTIMACY, SECRET_SEEKING_COMPULSION, SOCIAL_ROOTING,
                 PERCEPTUAL_ACCLIMATIZATION, DARK_EROTIC_FIELD, COFFER_PANIC_PROTECTION]
    status: CANON_APPROVED
    epistemic_class: FACT
