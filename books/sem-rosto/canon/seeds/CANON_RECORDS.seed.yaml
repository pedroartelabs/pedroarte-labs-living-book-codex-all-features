  - id: CR-P14-01
    domain: BOOK_CONTRACT
    title: "Arquitetura do Livro 1"
    statement: "CRIME → CLOSED; DARK ROMANCE → IRREVERSIBLE, NOT CLOSED; REDMUR → EXPANDED."
