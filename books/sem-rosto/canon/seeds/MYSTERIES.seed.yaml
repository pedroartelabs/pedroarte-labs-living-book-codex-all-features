# MYSTERIES — mistérios de série com escopo de livro (SDD seção 20).
#
# Guarda a PERGUNTA, o escopo, o teto por livro e as incógnitas que a compõem. Nunca resposta,
# hipótese privilegiada ou "world_truth". A verdade de um mistério reservado não existe em arquivo;
# a do crime do Livro 1 morará no ledger (GT engine-only) quando a autora decidir o crime.
#
# state_ceiling (teto do estado projetado no livro): UNOPENED < OPEN < EXPANDING < PARTIALLY_RESOLVED < RESOLVED.
# O dossiê §12.4 permite no Livro 1 citar, provocar, mostrar datas, contradizer documentos, apresentar
# símbolos, revelar consequências e demonstrar incompatibilidades para toda a história bloqueada: por isso
# os reservados têm teto EXPANDING. O que nunca ocorre é ensinar uma incógnita a qualquer conhecedor.
#
# `dossier_item` = posição no dossiê §18 (RESERVED MYSTERIES). A autoria dos mapas (Q-MAP-AUTHOR)
# pertence à cartografia e não é repetida aqui.
