# HARD_LOCKS — invariantes que nenhuma cena, agente ou proposta ordinária viola (SDD seção 15).
#
# modes:     STRUCTURAL (reprova sozinho) · LEXICAL_PREFILTER (alerta → Warden) · JUDGMENT (agente/humano)
# detectors: SR-*                  regra do validador da obra (catálogo em check_sem_rosto_canon.py)
#            ENGINE:<script>:<id>  regra de um validador do motor (REUSE)
#            JUDGMENT:<AGENTE>     item do checklist de um revisor
# Mudar qualquer linha exige aprovação humana com subject_sha256 deste arquivo (SR-HL-02);
# mudar HL-01..HL-04 e HL-20 exige revisão formal da franquia (dossiê §22).
apiVersion: pedroarte.livingbooks/v1
kind: SemRostoHardLocks
metadata:
  project_id: sem-rosto
  version: 0.1.0
  owner: CANON_GUARDIAN
  approval: null

