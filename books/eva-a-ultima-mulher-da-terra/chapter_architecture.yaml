  - number: 16
    title: Continuacionistas
    movement: IV — O Corpo do Mundo
    pov: Amos Weller
    time: Eva, 17 anos e alguns meses
    location: Parlamentos de três países, intercalados
    function: Mostrar o auge legislativo do movimento continuacionista, incluindo a proposta explícita de reserva reprodutiva compulsória aos dezoito anos, com os melhores argumentos genuínos de ambos os lados representados em debate.
    dramatic_question: A sobrevivência da espécie humana justifica suspender, mesmo temporariamente, a autonomia corporal de uma única pessoa?
    irreversible_turn: A proposta de reserva compulsória avança em dois países autoritários e é derrotada por margem estreita numa democracia, estabelecendo o mundo dividido que caracteriza o resto da obra.
    continuity:
      - Nenhum país é nomeado com nome real; os regimes autoritários citados são fictícios.
      - Weller defende a proposta publicamente sem esconder de si mesmo, em momentos privados, sua origem emocional.
      - O resultado dividido cria a tensão legal que domina o Capítulo 17.
    living_book_vitals:
      pressure: máxima, política
      breath: retórica, treinada
      sensory_anchor: placar de votação eletrônico piscando empatado antes de decidir
    demographic_counter: null

  - number: 17
