  - number: 22
    title: Trinta
    movement: V — Eva Livre
    pov: Eva
    time: Eva, 30 anos, aniversário
    location: Comunidade isolada e, por telefone, Instituto Meridian
    function: Fechar a Parte V com Eva decidindo, sozinha, trocar fuga por investigação científica direta do próprio fenômeno.
    dramatic_question: O que significa deixar de fugir de uma pergunta e começar a persegui-la?
    irreversible_turn: Eva liga para Sara Kessler, agora próxima da aposentadoria, e pede ajuda para entrar formalmente em um programa de pesquisa genética — não como paciente, como candidata a cientista.
