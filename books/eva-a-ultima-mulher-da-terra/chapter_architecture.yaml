chapters:
  - number: 1
    title: Comum
    movement: I — O Último Nascimento
    pov: Alma
    time: Dia Zero, manhã
    location: Maternidade Municipal de Campo Alegre
    function: Estabelecer o nascimento de Eva como inteiramente comum antes de qualquer pessoa saber que é extraordinário.
    dramatic_question: O que torna um nascimento memorável antes de a história decidir que ele é histórico?
    irreversible_turn: Alma e Vicente registram o nome Eva, escolhido meses antes, sem saber que nenhuma outra menina nascerá depois dela.
    continuity:
      - Eva nasce saudável, peso e Apgar normais, parto vaginal sem intercorrências.
      - Alma é ex-enfermeira obstétrica da mesma maternidade.
      - Vicente é mecânico autônomo.
      - Nenhum personagem sabe, neste capítulo, que algo é diferente.
    living_book_vitals:
      pressure: nenhuma
      breath: regular, doméstica
      sensory_anchor: cheiro de álcool e leite em pó no quarto do hospital
    demographic_counter: null

  - number: 2
    title: Nenhuma Depois Dela
    movement: I — O Último Nascimento
    pov: Sara Kessler
    time: Dia Zero +14 meses
    location: Ambulatório pediátrico regional
    function: Introduzir Sara Kessler notando, por rotina clínica, que nenhuma paciente nova é menina há mais de um ano.
    dramatic_question: Uma coincidência estatística regional é ruído ou sinal?
    irreversible_turn: Sara compila os próprios registros e telefona para uma colega em outro estado, que confirma o mesmo padrão.
    continuity:
      - Sara ainda não conhece Eva pessoalmente.
      - O padrão observado por Sara é regional, não mundial.
      - Nenhuma autoridade foi notificada ainda.
    living_book_vitals:
      pressure: baixa, clínica
      breath: atenta
      sensory_anchor: fichas de papel empilhadas por mês de nascimento
    demographic_counter: null

  - number: 3
    title: A Mulher dos Números
    movement: I — O Último Nascimento
    pov: Yuki Tanaka
    time: Dia Zero +20 meses
    location: Escritório de estatística demográfica, sede multilateral
    function: Cruzar registros civis de dezenas de países e confirmar que o padrão de Sara é mundial, não regional.
    dramatic_question: Como uma cientista comunica algo que soa impossível sem soar histérica?
    irreversible_turn: Yuki confirma zero nascimentos femininos registrados em qualquer país nos últimos vinte meses e prepara o primeiro relatório confidencial.
    continuity:
      - Yuki não sabe ainda o nome de nenhuma criança específica.
      - O relatório de Yuki ainda não foi divulgado publicamente.
      - Governos individuais já notavam o padrão internamente sem coordenação entre si.
    living_book_vitals:
      pressure: crescente, institucional
      breath: contida atrás de portas fechadas
      sensory_anchor: gráfico de linha caindo a zero numa tela de projetor
    demographic_counter: null

  - number: 4
    title: O Nome Antes do Fato
    movement: I — O Último Nascimento
    pov: Vicente
    time: Dia Zero +2 anos
    location: Casa da família Duarte, Campo Alegre
    function: A identidade de Eva como a última menina nascida se torna pública e a família comum se torna terreno histórico da noite para o dia.
    dramatic_question: O que uma família comum faz quando a própria filha se torna notícia mundial em uma manhã?
    irreversible_turn: Repórteres cercam a casa dos Duarte no mesmo dia em que o relatório de Yuki Tanaka vaza para a imprensa internacional.
    continuity:
      - Eva tem dois anos e não compreende o que acontece.
      - A coincidência do nome Eva é notada publicamente pela primeira vez neste capítulo.
      - O governo local designa proteção temporária à família ainda hoje.
    living_book_vitals:
      pressure: súbita, esmagadora
      breath: cortada por flashes de câmera
      sensory_anchor: andorinhões-de-vidro voando alto sobre a rua cheia de antenas de transmissão
    protected_scene: LAST_GIRL_REVEAL
    demographic_counter: null

  - number: 5
    title: Patrimônio Genético
    movement: I — O Último Nascimento
    pov: Vicente
    time: Dia Zero +2 anos e alguns meses
    location: Escritório provisório do Conselho Mundial de Continuidade Humana
    function: O Estado propõe formalmente classificar Eva como recurso de interesse mundial; os pais recusam a primeira versão do acordo.
    dramatic_question: Que palavra usar para uma criança que instituições já chamam de patrimônio?
    irreversible_turn: Vicente e Alma assinam apenas um acordo de proteção física, recusando qualquer cláusula sobre material biológico futuro de Eva.
    continuity:
      - O Conselho Mundial de Continuidade Humana (CMCH) é apresentado pela primeira vez, ainda sem Amos Weller em cena.
      - A recusa dos pais se torna precedente legal citado décadas depois.
      - Eva permanece sem saber, nesta idade, o teor da reunião.
    living_book_vitals:
      pressure: alta, burocrática
      breath: seca, formal
      sensory_anchor: caneta corporativa que não assina onde os pais recusam
    demographic_counter: CF-1

  - number: 6
    title: O Último Berçário
    movement: II — A Menina Impossível
    pov: Eva
    time: Eva, 6 anos
    location: Creche do Instituto Meridian
    function: Mostrar, pela primeira vez do ponto de vista de Eva, uma turma inteiramente masculina e a pergunta infantil que nenhum adulto sabe responder bem.
    dramatic_question: Como uma criança de seis anos formula a pergunta que a ciência mundial ainda não conseguiu responder?
    irreversible_turn: Eva pergunta à professora por que não existe nenhuma menina mais nova que ela, e a resposta evasiva da adulta é a primeira vez que Eva sente que os adultos escondem algo dela.
    continuity:
      - A família Duarte já se realocou para o Instituto Meridian por segurança.
      - Nenhuma criança na turma de Eva, nem em turmas mais novas, é menina.
      - Eva ainda não tem vocabulário para "a última".
    living_book_vitals:
      pressure: baixa, mas persistente
      breath: infantil, curiosa
      sensory_anchor: giz de cera quebrado dividido entre meninos
    demographic_counter: null

  - number: 7
    title: Escolta
    movement: II — A Menina Impossível
    pov: Denise Farro
    time: Eva, 7 anos
    location: Trajeto entre o Instituto Meridian e a cidade vizinha
    function: Estabelecer o aparato de segurança em torno de Eva através de quem o executa, não apenas de quem o sofre.
    dramatic_question: Como proteger uma criança sem que a proteção vire a própria ameaça à sua infância?
    irreversible_turn: Uma tentativa de abordagem não violenta mas invasiva de um grupo Evista obriga Denise a formalizar o primeiro protocolo de escolta permanente.
    continuity:
      - Denise Farro é apresentada como responsável direta pela segurança pessoal de Eva.
      - O incidente não fere ninguém, mas encerra qualquer rotina de deslocamento livre da família.
      - Vicente questiona pela primeira vez se a proteção já superou a necessidade real.
    living_book_vitals:
      pressure: tensa, contida
      breath: profissional, vigilante
      sensory_anchor: rádio comunicador preso ao cinto emitindo estática
    demographic_counter: null

  - number: 8
    title: O Corredor das Bonecas
    movement: II — A Menina Impossível
    pov: Eva
    time: Eva, 8 anos
    location: Shopping center da cidade vizinha ao Instituto Meridian
    function: Materializar o desaparecimento econômico de produtos infantis femininos através de uma cena concreta de mercado vista por uma criança.
    dramatic_question: O que uma criança sente ao ver o próprio tipo de brinquedo sendo retirado das prateleiras, sem que ninguém lhe diga por quê?
    irreversible_turn: Eva percebe que a loja de brinquedos está reduzindo pela metade a seção que ela mais gosta, e pergunta a Alma se é porque ela é "estranha".
    continuity:
      - A loja está fechando permanentemente a seção infantil feminina por falta de demanda futura, não presente.
      - Alma evita responder diretamente à pergunta de Eva.
      - Este é o primeiro momento em que Eva associa o próprio corpo a uma escassez econômica.
    living_book_vitals:
      pressure: silenciosa, comercial
      breath: contida por Alma
      sensory_anchor: etiquetas de liquidação coladas sobre embalagens antigas
    demographic_counter: null

  - number: 9
    title: Dez
    movement: II — A Menina Impossível
    pov: Eva
    time: Eva, 10 anos, aniversário
    location: Instituto Meridian, sala de televisão comum
    function: Fechar a Parte II com Eva ouvindo, por acidente, um fragmento de debate internacional sobre seu próprio futuro reprodutivo.
    dramatic_question: O que significa fazer dez anos quando adultos já discutem publicamente sua fertilidade futura?
    irreversible_turn: Eva desliga a televisão sozinha, sem contar a ninguém o que ouviu, e começa a guardar perguntas que não faz em voz alta.
    continuity:
      - O debate ouvido por Eva antecipa, sem ela entender totalmente, o tema da Parte IV.
      - Sara Kessler é mencionada como presente na mesa de debate, à distância, sem saber que Eva assiste.
      - Este é o primeiro segredo consciente que Eva guarda dos pais.
    living_book_vitals:
      pressure: interna, recém-formada
      breath: suspensa
      sensory_anchor: controle remoto apertado com força maior que o necessário
    demographic_counter: CF-2

  - number: 10
    title: Quando "Menina" Virou Categoria
    movement: III — A Última Menina
    pov: Sara Kessler
    time: Eva, 11 anos
    location: Congresso médico internacional
    function: Mostrar, pela perspectiva de Sara, a palavra "menina" mudando de uso corrente para categoria demográfica em declínio na literatura médica e educacional.
    dramatic_question: O que acontece com uma língua quando uma palavra comum começa a precisar de nota de rodapé?
    irreversible_turn: Sara apresenta um estudo em que "irmã mais nova" e "colega de turma menina" já não têm exemplos vivos com menos de onze anos em nenhum país, e a plateia recebe isso em silêncio, não em choque.
    continuity:
      - Sara agora é consultora médica formal do caso de Eva, com acesso a prontuários.
      - O termo "categoria em extinção ativa" começa a circular em relatórios oficiais.
      - Eva entra na adolescência fora de cena neste capítulo.
    living_book_vitals:
      pressure: acadêmica, gelada
      breath: pausada por quem já se acostumou
      sensory_anchor: slide de apresentação com a última data de matrícula feminina numa escola primária
    demographic_counter: null

  - number: 11
