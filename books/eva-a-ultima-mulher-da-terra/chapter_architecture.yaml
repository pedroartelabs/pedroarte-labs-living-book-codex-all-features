      - O banco de óvulos voluntário se torna infraestrutura recorrente nas partes seguintes.
      - Eva não aparece fisicamente neste capítulo, apenas como pauta.
    living_book_vitals:
      pressure: fria, determinada
      breath: contida por décadas de luto convertido em trabalho
      sensory_anchor: exame pré-natal antigo guardado numa gaveta de escritório oficial
    demographic_counter: null

