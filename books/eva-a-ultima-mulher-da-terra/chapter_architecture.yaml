    movement: IV — O Corpo do Mundo
    pov: Eva
    time: Eva, 18 anos, dia do aniversário
    location: Tribunal internacional ad hoc
    function: Eva atinge a maioridade legal e recusa publicamente, com apoio jurídico do movimento Eva Livre, qualquer programa reprodutivo compulsório ou voluntário-sob-pressão.
    dramatic_question: Uma vitória legal individual muda algo estrutural, ou apenas adia o mesmo conflito para a próxima crise?
    irreversible_turn: O tribunal reconhece o direito de Eva de recusar qualquer intervenção sobre seu material genético, mas o CMCH mantém aberta uma cláusula de "emergência civilizacional" que permanece como ameaça futura.
    continuity:
      - Esta é a vitória legal mais importante de Eva na obra, e também a mais exposta publicamente.
      - Weller aceita a derrota formalmente, mas não abandona a doutrina.
      - Fecha a Parte IV sem resolver o conflito estrutural, apenas a batalha pontual.
    living_book_vitals:
      pressure: aliviada por dentro, esmagadora por fora
      breath: primeira respiração funda em público que Eva permite a si mesma
      sensory_anchor: andorinhões-de-vidro cruzando o átrio de vidro do tribunal
    protected_scene: MAJORITY_REFUSAL
    demographic_counter: CF-4

