  - number: 13
    title: A Última Turma
    movement: III — A Última Menina
    pov: Eva
    time: Eva, 15 anos
    location: Formatura do ensino médio de uma escola parceira do Instituto Meridian
    function: Fazer Eva testemunhar a formatura da última turma que ainda contém mulheres nascidas antes do Dia Zero, e perceber que mesmo essa geração está se tornando rara.
    dramatic_question: O que significa ser jovem quando até as pessoas mais próximas da sua idade já pertencem, tecnicamente, a uma geração em extinção?
    irreversible_turn: Eva percebe, olhando a plateia, que não existe nenhuma mulher na sala mais jovem que as formandas de dezoito anos — e que ela mesma nunca terá colegas de escola do próprio sexo.
    continuity:
      - Esta é a primeira crise existencial explícita de Eva na obra.
      - Sara Kessler está presente e nota a mudança de humor de Eva sem intervir.
      - Fecha a Parte III sem resolução emocional, propositalmente.
    living_book_vitals:
