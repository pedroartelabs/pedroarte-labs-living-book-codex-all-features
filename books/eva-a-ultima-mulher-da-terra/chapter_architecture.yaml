    movement: IV — O Corpo do Mundo
    pov: Amos Weller
    time: Eva, 16 anos
    location: Sede do Conselho Mundial de Continuidade Humana
    function: Apresentar Amos Weller em profundidade, incluindo a perda pessoal que fundamenta sua doutrina, ao propor o primeiro banco internacional de óvulos e material genético compulsório para menores identificadas como geneticamente relevantes.
    dramatic_question: Uma convicção nascida de luto real deixa de ser manipulação só porque é sincera?
    irreversible_turn: Weller consegue aprovar o banco internacional de óvulos para adultas voluntárias, mas sua proposta de incluir menores de idade sem consentimento pleno é rejeitada por um voto.
    continuity:
