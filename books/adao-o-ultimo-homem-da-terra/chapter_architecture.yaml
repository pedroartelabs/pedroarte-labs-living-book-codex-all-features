  - number: 1
    title: Sala de Parto Quatro
    movement: I — Dia Zero
    pov: Alma Ferro
    time: AS0, madrugada
    location: Maternidade Nossa Senhora do Porto, Porto Cinza
    function: Estabelecer o nascimento inteiramente comum de Adão e o Dia Zero apenas em retrospecto invisível ao leitor.
    dramatic_question: O que Alma nota, sem entender, na sala de parto naquela madrugada?
    irreversible_turn: Adão nasce; um obstetra comenta, sem importância, que é o único menino do plantão da noite.
    continuity:
      - Adão nasce em Porto Cinza, filho de Alma e Heitor Ferro.
      - A maternidade registra nascimentos normalmente; nada é anunciado como extraordinário.
      - Nenhum personagem suspeita de qualquer coisa fora do comum.
    living_book_vitals:
      pressure: doméstica
      breath: regular
      sensory_anchor: cheiro de álcool e leite sobre lençol quente
