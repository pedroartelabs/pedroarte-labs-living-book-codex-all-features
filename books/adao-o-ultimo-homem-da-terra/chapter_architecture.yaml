  - number: 2
    title: Um Erro na Planilha
    movement: I — Dia Zero
    pov: Vera Nakamura
    time: AS1
    location: Observatório Global de População, sede regional
    function: Introduzir a descoberta estatística do fenômeno como ruído descartável.
    dramatic_question: Vera vai insistir num dado que todos os colegas chamam de erro de amostragem?
    irreversible_turn: Ela arquiva um relatório interno recomendando "observar novamente em doze meses" — decisão que a perseguirá por décadas.
    continuity:
      - O Observatório Global de População (OGP) é organismo fictício pré-existente ao fenômeno.
      - Vera é demógrafa sênior do OGP.
      - Sinais estatísticos semelhantes aparecem, isoladamente, em múltiplos países no mesmo período.
    living_book_vitals:
      pressure: burocrática
      breath: contida
      sensory_anchor: cursor piscando sobre uma célula de planilha

  - number: 3
