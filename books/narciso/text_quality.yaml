# Override de engine/templates/TEXT_QUALITY_DEFAULTS.yaml para Narciso.
#
# detect_repetition.py faz merge por SEÇÃO, não por item: `patterns` repete a
# lista base inteira e acrescenta os clichês da obra (SDD, seção 12.4).
# validate_narciso.py --mode package reprova se algum item da base sumir.
apiVersion: pedroarte.livingbooks/v1
kind: TextQualityOverrides
spec:
  cliches:
    enabled: true
    severity: MEDIUM
    patterns:
      # --- base de engine/templates/TEXT_QUALITY_DEFAULTS.yaml ---
      - coração disparado
      - coração aos pulos
      - coração na boca
      - lágrimas escorriam
      - lágrimas rolaram
      - olhos marejados
      - marejaram os olhos
      - um arrepio percorreu
      - arrepio na espinha
      - gelou a espinha
      - sangue gelou
      - silêncio ensurdecedor
      - sorriso amarelo
      - nó na garganta
      - peso no peito
      - friozinho na barriga
      - borboletas no estômago
      - o tempo parou
      - o tempo pareceu parar
      - o mundo desabou
      - como se o mundo
      - respirou fundo e
      - suspirou fundo
      - engoliu em seco
      - ficou sem palavras
      - não era mais o mesmo
      - naquele exato momento
      - por um breve instante
      - mal sabia ele
      - mal sabia ela
      - só o tempo diria
      # --- beleza masculina genérica e dark romance, catalogados nesta obra ---
      - deus grego
      - beleza estonteante
      - beleza de tirar o fôlego
      - perfeito demais para ser real
      - olhos penetrantes
      - abdômen definido
      - corpo esculpido
      - mandíbula esculpida
      - sorriso predatório
      - olhar predatório
      - aura de perigo
      - calor subiu pelo corpo
      - não conseguia desviar o olhar
      - como se pudesse ver sua alma
      - reflexo sombrio
      - espelho da alma
