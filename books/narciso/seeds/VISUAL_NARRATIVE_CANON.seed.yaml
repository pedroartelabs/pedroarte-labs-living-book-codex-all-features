apiVersion: pedroarte.livingbooks/v1
kind: VisualNarrativeCanon
# Semente do canon visual de Narciso (docs/sdd/NARCISO_CANONICAL_SDD_v0.1.md, 13–17, 21, 23).
#
# T043_VISUAL_NARRATIVE_CANON (VISUAL_DIRECTOR, lock VISUAL_CANON_WRITE)
# consolida este arquivo em runtime/canon/VISUAL_NARRATIVE_CANON.yaml.
# Validadores: engine/scripts/check_visual_canon.py e book/validators/validate_narciso.py.
# Pranchas de miolo (IL-*) entram no Slice 4; aqui só capa, lombada,
# contracapa, capa nua do collector e abertura de capítulo.
metadata:
  project_id: narciso
  version: 0.1.0
  owner: VISUAL_DIRECTOR
  author_dna: {author_id: bea_halden, version: 1, sha256: null}
  narrative_canon_refs: {canon_registry_version: null, causal_ledger_version: null}

book_dna:
  visual_thesis: "A beleza é uma superfície que olha de volta."
  duality:
    outer_truth: "Narciso olha para quem segura o livro."
    hidden_truth: "Narciso olha para o reflexo que o livro produz."
    anchors: ["SCENE:THE_CENTER", "SCENE:WE_STILL_LOOK"]
  palette:
    GROUND: "#0E0D0F"
    INK: "#E9E1D2"
    METAL: {material: AGED_GOLD, hex: "#8A6C3E"}
    PULSE: "#3E0C16"
  role_overrides:
    - key: defaults.forbid_literal_protagonist_on_cover
      value: false
      override_reason: "Decisão humana OQ-N1: a beleza de Narciso é a isca da tese; ele aparece por fragmento do rosto, sem revelar o rosto inteiro."
      approval: APR-COVER-01
  typography_bindings: {}

vetoes:
  - {id: VETO-N01, match: [abdômen definido, músculo oleado, banco de imagens], source: "DOC:/book/planning/NARCISSUS_VISUAL_BIBLE.md#vetos", rule_kind: CANONICAL, rationale: "Beleza masculina genérica."}
  - {id: VETO-N02, match: [torso nu, shirtless], source: "DOC:/book/planning/NARCISSUS_VISUAL_BIBLE.md#vetos", rule_kind: CANONICAL, rationale: "Nudez sem função narrativa."}
  - {id: VETO-N03, match: [caveira, faca, sangue decorativo, pétalas de rosa], source: "DOC:/book/planning/NARCISSUS_VISUAL_BIBLE.md#vetos", rule_kind: CANONICAL, rationale: "Iconografia de gênero sem âncora."}
  - {id: VETO-N04, match: [toga, louros, templo grego, coluna grega], source: "DOC:/book/planning/NARCISSUS_VISUAL_BIBLE.md#vetos", rule_kind: CANONICAL, rationale: "Kitsch mítico."}
  - {id: VETO-N05, match: [pintura célebre, releitura de quadro], source: "DOC:/book/planning/NARCISSUS_VISUAL_BIBLE.md#vetos", rule_kind: CANONICAL, rationale: "Originalidade de composição."}
  - {id: VETO-N06, match: [relógio derretido, paisagem surreal reconhecível], source: "DOC:/book/planning/NARCISSUS_VISUAL_BIBLE.md#vetos", rule_kind: CANONICAL, rationale: "Obras modernas protegidas."}
  - {id: VETO-N07, match: [infantil, adolescente, juvenil], source: "DOC:/book/planning/NARCISSUS_VISUAL_BIBLE.md#vetos", rule_kind: CANONICAL, rationale: "Adulto inequívoco."}
  - {id: VETO-N08, match: [magreza, costelas à mostra], source: "DOC:/book/planning/NARCISSUS_VISUAL_BIBLE.md#vetos", rule_kind: CANONICAL, rationale: "Dignidade do definhamento."}
  - {id: VETO-N09, match: [selfie], source: "DOC:/book/planning/NARCISSUS_VISUAL_BIBLE.md#vetos", rule_kind: CANONICAL, rationale: "Banaliza a tese."}
  - {id: VETO-N10, match: [neon, fumaça], source: "DOC:/book/planning/NARCISSUS_VISUAL_BIBLE.md#vetos", rule_kind: CANONICAL, rationale: "Clichê visual de gênero."}
  - {id: VETO-N11, match: [marca d'água, watermark], source: "DOC:/book/planning/NARCISSUS_VISUAL_BIBLE.md#vetos", rule_kind: CANONICAL, rationale: "Nenhum texto em ilustração."}
  - {id: VETO-N12, match: [genitália, ato sexual], source: "DOC:/book/planning/NARCISSUS_VISUAL_BIBLE.md#vetos", rule_kind: CANONICAL, rationale: "Sem conteúdo explícito em imagem."}
  - {id: VETO-N13, match: [rosto do reflexo inteiro], source: "DOC:/book/planning/NARCISSUS_VISUAL_BIBLE.md#vetos", rule_kind: CANONICAL, rationale: "O reflexo nunca é resolvido visualmente."}
  - {id: VETO-N14, match: [pessoa real, celebridade], source: "DOC:/book/planning/NARCISSUS_VISUAL_BIBLE.md#vetos", rule_kind: CANONICAL, rationale: "Rostos ficcionais."}

elements:
  - id: FIG-NARCISO
    label: Narciso
    class: FIGURE
    identity_ref: "DOC:/book/planning/FACE_CANON.seed.md#narciso-c-fiso-c-digo-de-identidade-fv-narciso-01"
    meaning: "O corpo como obra que se consome."
    functions:
      - {function: CHARACTER, anchors: ["TURN:2"]}
      - {function: TRANSFORMATION, anchors: ["SCENE:THE_CENTER", "LEDGER:EV-DSR-4"]}
      - {function: PROGRESSION, anchors: ["LEDGER:EV-DSR-5"]}
    count: 1
    prominence: DOMINANT
    first_appearance: "TURN:1"
    exposure: {spoiler_level: NONE, reveal: null}
    accessibility: {monochrome_safe: true, min_render_size_mm: 20, text_alternative: "Parte do rosto de um homem de olhos cinza-esverdeados, com uma pinta sob o olho direito."}
    cost_class: ESSENTIAL
    approval: {policy: REQUIRE_APPROVAL, id: APR-FIG-NARCISO}
    status: PLANNED
    states:
      - {id: D0_PRISTINE, initial: true, memory_state: S, meaning: "perfeição que ainda não se viu", visual_description: "Rosto sereno, pele com luz uniforme, cabelo ondulado e barba feita."}
      - {id: D1_SLEEPLESS, memory_state: R, meaning: "o desejo tira o sono", visual_description: "Olheiras, barba de dois dias e lábio seco."}
      - {id: D2_FEVER, memory_state: T, meaning: "o toque falho vira febre", visual_description: "Cabelo molhado colado à testa, rubor e mãos trêmulas com a cicatriz aberta."}
      - {id: D3_WITHERING, memory_state: T, meaning: "a necessidade apaga a luz", visual_description: "Pele baça, unhas roídas, camisa suja; perda de luz no rosto."}
      - {id: D4_MARBLE, memory_state: P, meaning: "o corpo parece estátua", visual_description: "Palidez acinzentada, imobilidade de pedra e lábios rachados."}
      - {id: D5_TRACE, memory_state: E, meaning: "só restam vestígios", visual_description: "Nenhum corpo em quadro; camisa, lençol negro, marca na água e anel."}
    transitions:
      - {from: D0_PRISTINE, to: D1_SLEEPLESS, trigger: "SCENE:STATUE_BREAKS", display_from: NEXT_CHAPTER, because: "O rosto da estátua racha."}
      - {from: D1_SLEEPLESS, to: D2_FEVER, trigger: "SCENE:THE_CENTER", display_from: NEXT_CHAPTER, because: "As mãos não chegam juntas à superfície."}
      - {from: D2_FEVER, to: D3_WITHERING, trigger: "LEDGER:EV-DSR-4", display_from: NEXT_CHAPTER, because: "O desejo vira necessidade."}
      - {from: D3_WITHERING, to: D4_MARBLE, trigger: "LEDGER:EV-DSR-5", display_from: NEXT_CHAPTER, because: "Compulsão sem gozo."}
      - {from: D4_MARBLE, to: D5_TRACE, trigger: "SCENE:THE_NAME_AT_DAWN", display_from: NEXT_CHAPTER, because: "O nome chamado ao amanhecer."}

