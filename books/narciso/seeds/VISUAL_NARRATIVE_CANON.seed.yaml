    status: PLANNED
    states:
      - {id: VELADO, initial: true, memory_state: S, meaning: "proteção e proibição", visual_description: "Espelho alto coberto por lençol negro."}
      - {id: DESCOBERTO, memory_state: R, meaning: "curiosidade proibida", visual_description: "Lençol caído aos pés de um espelho descoberto."}
      - {id: MULTIPLICADO, memory_state: T, meaning: "desejo que se replica", visual_description: "Três espelhos inclinados uns para os outros no quarto."}
      - {id: FRATURADO, memory_state: T, meaning: "identidade partida", visual_description: "Espelho com uma rachadura diagonal a partir do centro."}
