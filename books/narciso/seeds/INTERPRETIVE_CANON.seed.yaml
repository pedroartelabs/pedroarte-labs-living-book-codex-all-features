apiVersion: pedroarte.livingbooks/v1
kind: NarcisoInterpretiveCanon
# Semente do canon interpretativo (docs/sdd/NARCISO_CANONICAL_SDD_v0.1.md, 9, 10, 11, 20, 29.4).
#
# T018N_INTERPRETIVE_CANON (CANON_GUARDIAN, lock CANON_WRITE) consolida este
# arquivo em runtime/canon/NARCISO_INTERPRETIVE_CANON.yaml. Guarda LEITURAS,
# nunca verdades: nenhum campo diz o que olha de volta nem se Narciso amou
# (NO_HIDDEN_ANSWER). Cada linha aponta para um evento do ledger causal.
metadata:
  project_id: narciso
  version: 0.1.0
  owner: CANON_GUARDIAN
  ledger_ref: /canon/CAUSAL_LEDGER.yaml
  source: seed
policy:
  no_hidden_answer: true
  min_support_per_evidence: 2
  min_viable_hypotheses_at_end: 3
  final_evidence_min_support: 3
  max_support_ratio: 2.0

reflection_hypotheses:
  - {id: H-PROJ, label: "projeção, alucinação, privação de sono ou compulsão"}
  - {id: H-SUPER, label: manifestação sobrenatural ligada à água da cava}
  - {id: H-SELF, label: o próprio Narciso}
  - {id: H-OTHER, label: outra pessoa real}
  - {id: H-GAZE, label: algo nascido da contemplação}

# S sustenta · C complica (não exclui) · X exclui · "-" neutro
reflection_evidence:
  - {id: RFX-01, chapter: 3, event: EV-RFX-01, status: PLANNED, perception: "fita de infância com a voz dele e um silêncio com ritmo de resposta",
     support: {H-PROJ: S, H-SUPER: S, H-SELF: S, H-OTHER: C, H-GAZE: "-"}}
  - {id: RFX-02, chapter: 6, event: EV-RFX-02, status: PLANNED, perception: "figura na água noturna sob lua e vento parado",
     support: {H-PROJ: S, H-SUPER: S, H-SELF: S, H-OTHER: S, H-GAZE: S}}
  - {id: RFX-03, chapter: 8, event: EV-RFX-03, status: PLANNED, perception: "piscar atrasado e pinta aparentemente do lado errado na janela",
