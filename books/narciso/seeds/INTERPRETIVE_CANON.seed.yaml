     consent_model: {ability_to_refuse: FULL, boundary_state: RESPECTED}, consequence: "ele volta à água na noite seguinte"}
  - {id: DSR-2, chapter: 15, event: EV-DSR-2, status: PLANNED, function: PLEASURE, pleasure: HIGH, explicitness_ceiling: FRANK,
     consent_model: {ability_to_refuse: FULL, boundary_state: RESPECTED}, consequence: "espelhos migram para o quarto"}
  - {id: DSR-3, chapter: 19, event: EV-DSR-3, status: PLANNED, function: RITUAL, pleasure: MEDIUM, explicitness_ceiling: FRANK,
     consent_model: {ability_to_refuse: FULL, boundary_state: PUSHED}, consequence: "cancela o mundo de fora"}
