# Revelações não ontológicas (SDD 20.4–20.5, RRL-05). Mudam o que o leitor
# acredita sobre um FATO — nunca sobre o que olha de volta nem sobre o amor.
# No ledger: evento REVELATION com beliefs.revises; a crença foi formada antes
# (formed_by) e a verdade divulgada já está em caused_by dessas cenas (INV-11).
revelations:
  - {id: REV-INSCRIPTION, chapter: 14, event: EV-REV-INSCRIPTION, status: PLANNED, revises: RB-AMINTAS-01,
     formed_by: [{event: EV-NAR-01, chapter: 1}], discloses: [GT-NAR-04],
     first_read: "Narciso não se importa com o sumiço de Amintas", second_read: "a frieza diante da estátua guardava culpa"}
  - {id: REV-DEBT, chapter: 16, event: EV-REV-DEBT, status: PLANNED, revises: RB-DEBT-01,
     formed_by: [{event: EV-ECO-03, chapter: 3}], discloses: [GT-NAR-05],
     first_read: "a internação da mãe de Eco foi paga por um benfeitor anônimo", second_read: "quem pagou foi Narciso, e ele nunca disse"}

# Âncoras: TURN:<capítulo> | SCENE:<cena protegida> | IL:<slot de ilustração> | OBJECT:<superfície do livro físico>
# Pistas de canal TEXT ganham, no CANON_UPDATE da wave que as escreve, `text_anchor: 'TEXT:<capítulo>:"trecho literal"'`
# em clue e trigger (RRL-04); uma âncora gravada nunca muda (INTERPRETIVE_RETCON).
