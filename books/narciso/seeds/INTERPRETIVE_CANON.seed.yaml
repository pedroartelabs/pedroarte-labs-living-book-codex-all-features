# Força: WEAK < MEDIUM < STRONG. Crenças do leitor RB-LOVE-A (amou) e
# RB-LOVE-B (nunca amou) permanecem left_open no ledger até o fim.
love_readings:
  - {id: LOVE-E1, chapter: 5, event: EV-LOVE-E1, status: PLANNED, gesture: "rejeita Eco em público com precisão cruel", beliefs: [RB-LOVE-A, RB-LOVE-B],
     love: {reading: "afasta Eco porque sabe que destrói quem se aproxima", strength: MEDIUM},
     narcissism: {reading: "tédio diante de mais uma admiradora", strength: MEDIUM}}
  - {id: LOVE-E2, chapter: 13, event: EV-LOVE-E2, status: PLANNED, gesture: "guarda e ouve à noite as gravações de Eco", beliefs: [RB-LOVE-A, RB-LOVE-B],
     love: {reading: "saudade da voz dela", strength: STRONG},
     narcissism: {reading: "a voz dela repete as falas dele e ele ouve a si mesmo", strength: STRONG}}
  - {id: LOVE-E3, chapter: 14, event: EV-LOVE-E3, status: PLANNED, gesture: "quebra o rosto da estátua quando Eco o toca", beliefs: [RB-LOVE-A, RB-LOVE-B],
     love: {reading: "ciúme e proteção contra a maldição", strength: STRONG},
     narcissism: {reading: "ninguém toca a imagem dele", strength: STRONG}}
  - {id: LOVE-E4, chapter: 16, event: EV-LOVE-E4, status: PLANNED, gesture: "paga anonimamente a internação da mãe de Eco", beliefs: [RB-LOVE-A, RB-LOVE-B],
     love: {reading: "cuidado sem cobrança", strength: STRONG},
     narcissism: {reading: "compra gratidão e permanência", strength: MEDIUM}}
  - {id: LOVE-E5, chapter: 18, event: EV-LOVE-E5, status: PLANNED, gesture: "pede que Eco fique e não fale", beliefs: [RB-LOVE-A, RB-LOVE-B],
     love: {reading: "vulnerabilidade diante das palavras", strength: STRONG},
     narcissism: {reading: "quer uma superfície silenciosa", strength: STRONG}}
  - {id: LOVE-E9, chapter: 24, event: EV-LOVE-E9, status: PLANNED, gesture: "entrega a única foto que guardava", beliefs: [RB-LOVE-A, RB-LOVE-B],
     love: {reading: "dá a ela a única imagem de si", strength: MEDIUM},
     narcissism: {reading: "livra-se da imagem que não obedece ao que vê na água", strength: STRONG}}
  - {id: LOVE-E6, chapter: 26, event: EV-LOVE-E6, status: PLANNED, gesture: "tira o reflexo de Eco do quadro", beliefs: [RB-LOVE-A, RB-LOVE-B],
     love: {reading: "protege Eco do que olha", strength: STRONG},
     narcissism: {reading: "não divide o que vê com ninguém", strength: STRONG}}
  - {id: LOVE-E7, chapter: 29, event: EV-LOVE-E7, status: PLANNED, gesture: "recusa ser tirado dali por Eco", beliefs: [RB-LOVE-A, RB-LOVE-B],
     love: {reading: "poupa Eco de afundar com ele", strength: STRONG},
     narcissism: {reading: "prefere o que vê a ela", strength: STRONG}}
  - {id: LOVE-E8, chapter: 31, event: EV-LOVE-E8, status: PLANNED, gesture: "chama um nome ao amanhecer e a resposta volta", beliefs: [RB-LOVE-A, RB-LOVE-B],
     love: {reading: "o nome chamado é o de Eco", strength: STRONG},
     narcissism: {reading: "o nome é o dele e o eco é da própria voz", strength: STRONG}}

# Modelo de consentimento da compulsão: decisão humana OQ-N5 (SDD 11.4).
desire_occurrences:
