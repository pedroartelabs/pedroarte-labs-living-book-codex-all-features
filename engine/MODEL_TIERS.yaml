apiVersion: pedroarte.livingbooks/v1
kind: ModelTiers
metadata:
  version: 1.0.0
spec:
  # Um agente só é "dosado" quando seu .toml declara model_tier = "S" | "M" | "XS".
  # Agentes sem model_tier permanecem sem tier declarado (ver discovery-books/
  # 04-plano-desenvolvimento-custo.md, Fase 2, para o rollout completo dos 68
  # agentes genéricos). Este arquivo só define QUAL MODELO cada tier usa —
  # trocar de fornecedor é editar este arquivo, nunca os 68 .toml de agente.
  default_tier: M
  tiers:
    S:
      label: Frontier
      description: >
        Julgamento criativo irredutível, decisões irreversíveis, risco
        ético/legal/de marca. Reservado deliberadamente a poucos agentes.
      models:
        anthropic: claude-opus-5
        openai: gpt-5
    M:
      label: Equilibrado
      description: >
        Execução competente contra uma especificação clara (canon, brief,
        voz de referência já aprovados); checagem estruturada contra uma
        fonte de verdade declarada.
      models:
        anthropic: claude-sonnet-5
        openai: gpt-5-mini
    XS:
      label: Rápido / econômico
      description: >
        Tarefa mecânica, de formato, checklist, ou verificação
        quase-objetiva (gramática, tipografia, contagem, comparação
        repetitiva contra uma referência já fixada).
      models:
        anthropic: claude-haiku-4-5-20251001
        openai: gpt-5-nano
  # A coluna `openai` é ilustrativa — ajuste para o modelo realmente
  # disponível no fornecedor/CLI usado para executar o runtime (Codex CLI,
  # Claude Code, ou outro). A coluna `anthropic` usa identificadores de
  # modelo correntes no momento em que este arquivo foi escrito.
  # Tabela de precos por milhao de tokens, usada por scripts/cost_report.py
  # para converter a telemetria do COST_LEDGER.md em USD. Precos mudam: revise
  # antes de tratar um relatorio como numero de negocio definitivo.
  pricing_usd_per_mtok:
    claude-opus-5: {input: 5.00, output: 25.00}
    claude-sonnet-5: {input: 3.00, output: 15.00}
    claude-haiku-4-5-20251001: {input: 1.00, output: 5.00}
    # Modelos de imagem cobram por token de imagem; registre o custo real
    # devolvido pela API em cost_usd quando disponivel.
    gpt-image-1: {input: 5.00, output: 40.00}
    gpt-image-1-mini: {input: 2.00, output: 8.00}
  pricing_note: >
    Precos de referencia em USD por milhao de tokens, conferidos na
    documentacao publica de cada fornecedor no momento em que este arquivo foi
    escrito. Se um modelo nao estiver listado, cost_report.py deixa o custo em
    branco em vez de estimar.
  provider_note: >
    Este runtime pode ser executado por diferentes CLIs agenticas
    (evidenciado por .codex/ e pela convenção compartilhada AGENTS.md).
    A sessão de execução deve resolver `model_tier` -> modelo concreto
    usando o campo correspondente ao seu próprio fornecedor.
