# AUTHOR_VISUAL_DNA — template do contrato v0.1
#
# Arquivo:    authors/<author_id>/AUTHOR_VISUAL_DNA.v<N>.yaml
# Camada:     A (identidade visual permanente da autora/catálogo) — seção
#             10.2 de docs/sdd/BEA_HALDEN_VISUAL_NARRATIVE_SYSTEM_SDD_v0.1.md
# Dono:       decisão humana/editorial; o motor nunca gera nem edita este
#             arquivo sozinho (ver seção 26.2 da SDD — REQUIRE_APPROVAL)
# Validador:  engine/scripts/check_visual_canon.py
# Desenho:    docs/sdd/BEA_HALDEN_VISUAL_NARRATIVE_SYSTEM_SDD_v0.1.md (seção 12.1)
#
# Princípios
# - O DNA da autora é GRAMÁTICA, nunca REPERTÓRIO: estrutura de cor, papéis
#   tipográficos, marca autoral, gramática de lombada, orçamento de
#   densidade e políticas de aprovação. NUNCA contém símbolo, objeto,
#   motivo, cena ou personagem de uma obra específica — isso pertence ao
#   canon visual do livro (VP-06 / AUTHOR_LAYER_CONTAINS_BOOK_SYMBOL).
# - Imutável a partir do primeiro release que o referencia (seção 27.2 da
#   SDD): uma mudança vira um arquivo v<N+1> novo, nunca uma edição do v<N>.
# - `generic_trope_watchlist` e `approval_policy_defaults` são específicos
#   de CATÁLOGO/GÊNERO (ex.: Dark Romance). Este template do motor fica
#   neutro de gênero (engine/AGENTS.md) — populam-se no pacote real da
#   autora, sob `authors/<id>/`, nunca aqui.
#
# Este template é validado pela suíte de testes junto de um
# VISUAL_NARRATIVE_CANON_TEMPLATE.yaml compatível: um campo que mudar aqui
# precisa mudar no validador, e vice-versa.

apiVersion: pedroarte.livingbooks/v1
kind: AuthorVisualDNA
metadata:
  author_id: author-slug
  public_name: TO_DEFINE
  version: 1
  status: DRAFT                 # DRAFT | APPROVED | SUPERSEDED — vira APPROVED só por decisão humana
  approved_by_file: null        # /project_state/APPROVALS/VISUAL/AUTHOR_DNA_v1.md quando aprovado
  supersedes: null              # id do DNA anterior, quando este for uma nova versão

thesis:
  - TO_DEFINE

invariants:
  # Constraints — acumulam com as do livro; o livro NUNCA sobrescreve isto
  # (ver seção 13.1 da SDD, R3 AUTHOR_INVARIANT_OVERRIDE).
  author_name_on: [FRONT_COVER, SPINE, TITLE_PAGE]
  author_mark_required_on: [SPINE, BACK_COVER]
  title_hierarchy: TITLE_OVER_AUTHOR   # TITLE_OVER_AUTHOR | AUTHOR_OVER_TITLE
  max_dominant_per_surface: 1
  chekhov_required: true
  sigils_monochrome_safe: true
  hidden_surface_max_spoiler: MEDIUM
  public_surface_max_spoiler: LOW

defaults:
  # Preferences — o livro pode sobrescrever com role_overrides[] +
  # override_reason (ver seção 13, R2 OVERRIDE_WITHOUT_REASON).
  density:
    max_secondary_per_surface: 2
    decorative_budget_per_surface: 1
  forbid_literal_protagonist_on_cover: true

color:
  value_structure: LOW_KEY       # LOW_KEY (fundo escuro dominante) | HIGH_KEY
  roles:
    # Papéis, nunca hexadecimais obrigatórios. `default` é só um valor de
    # partida — cada livro escolhe seu próprio valor DENTRO da faixa
    # (lightness/saturation em HSL, 0..1). As faixas abaixo são exemplo
    # estrutural válido, calibradas contra os hexadecimais de exemplo.
    GROUND: {lightness: [0.03, 0.22], saturation: [0.00, 0.20], default: "#121113"}
    INK:    {lightness: [0.75, 0.95], saturation: [0.10, 0.45], default: "#E6DCCB"}
    METAL:  {lightness: [0.25, 0.55], saturation: [0.10, 0.70], default: "#8C6A3C", material_family: WARM_METAL}
    PULSE:  {lightness: [0.10, 0.35], saturation: [0.35, 0.90], max_area_ratio: 0.12, default: "#5A0E1C"}
  signature_material: TO_DEFINE   # material que só a marca autoral usa sempre (ex.: BURNT_COPPER)

typography:
  # SEMANTIC ROLE — intenção, nunca arquivo de fonte. O binding (família,
  # arquivo, licença) é FONT IMPLEMENTATION, por livro/edição (seção 17.4).
  roles:
    TITLE:          {classification: HIGH_CONTRAST_SERIF, case: UPPER, tracking: WIDE, weight: [500, 700]}
    SUBTITLE:       {classification: HIGH_CONTRAST_SERIF, case: SENTENCE, style: ITALIC}
    AUTHOR:         {classification: GEOMETRIC_SANS, case: UPPER, tracking: VERY_WIDE, weight: [300, 400]}
    SERIES:         {classification: GEOMETRIC_SANS, case: UPPER, size_relative_to: AUTHOR, ratio: 0.6}
    TAGLINE:        {classification: HIGH_CONTRAST_SERIF, style: ITALIC}
    EDITION_LABEL:  {classification: GEOMETRIC_SANS, case: UPPER}
    CHAPTER_NUMBER: {classification: GEOMETRIC_SANS, case: UPPER, tracking: WIDE}
    CHAPTER_TITLE:  {classification: HIGH_CONTRAST_SERIF}
    BODY:           {classification: BOOK_SERIF, inherit_from: KDP_LAYOUT}   # identidade NUNCA altera o corpo
  min_body_pt: 7.0

author_mark:
  id: MARK-TO_DEFINE
  assets: {vector: null, raster_1bit: null}
  monochrome_required: true
  min_size_mm: 5
  clearspace_ratio: 0.5
  allowed_surfaces: [SPINE, BACK_COVER, TITLE_PAGE, COPYRIGHT_PAGE]
  forbidden_surfaces: [CHAPTER_OPENER]      # a abertura pertence ao sigil do livro, não à marca da autora

spine_grammar:
  mode: INDIVIDUAL_CONSISTENT     # INDIVIDUAL_CONSISTENT | SERIES_CONTINUOUS (FUTURE — seção 17.6)
  title_axis: TOP_TO_BOTTOM
  author_zone: {from: 0.80, to: 0.93}       # fração da altura, a partir do topo
  mark_zone: {from: 0.94, to: 0.98}
  band: {position: 0.08, height_ratio: 0.012, role_color: METAL}

# Específico de catálogo/gênero — populado no pacote real da autora, nunca
# neste template neutro do motor (engine/AGENTS.md).
generic_trope_watchlist: []

approval_policy_defaults:
  AUTHOR_MARK: REQUIRE_APPROVAL
  COVER_COMPOSITION: REQUIRE_APPROVAL
  DOMINANT_SYMBOL: REQUIRE_APPROVAL
  FINISH_INTENT_COLLECTOR: REQUIRE_APPROVAL
  HIDDEN_SURFACE: REQUIRE_APPROVAL
  EDGE_ART: REQUIRE_APPROVAL
  FIGURE_ON_COVER: REQUIRE_APPROVAL
  NARRATIVE_ARTIFACT: SUGGEST
  SIGIL_STATE: SUGGEST
  PALETTE_WITHIN_ROLES: AUTO
