apiVersion: pedroarte.livingbooks/v1
kind: LiteraryTaskGraph
metadata:
  project_id: antes-que-as-criancas-crescam
  title: Antes que as Crianças Cresçam
  author: Pedro Arte
  language: pt-BR
  chapter_count: 30
  engine_version: 1.0.0
  book_version: 1.0.0
spec:
  execution_policy:
    mode: AUTONOMOUS
    continue_without_user_confirmation: true
    explicit_subagent_spawning: true
    stop_and_fix:
      enabled: true
      rule: If any blocking validation or gate fails, repair, revalidate, then continue.
    max_parallel_tasks: 8
    max_parallel_writers: 4
    max_parallel_critics: 8
    max_parallel_image_tasks: 6
    max_parallel_sound_tasks: 6
    never_skip_dependencies: true
    never_skip_blocking_gates: true
    reviewer_write_access:
      manuscript: false
      canon: false
      reports: true
    merge_policy:
      destructive_merge: false
      merge_log_required: true
    canon_write_policy:
      concurrent_write: false
      exclusive_owner: CANON_GUARDIAN
    final_manuscript_write_policy:
      concurrent_write: false
      exclusive_owner: LEAD_NOVELIST
  task_states:
  - PENDING
  - READY
  - SPAWNING
  - RUNNING
  - WAITING_DEPENDENCIES
  - UNDER_REVIEW
  - REVISION_REQUIRED
  - BLOCKED
  - FAILED
  - APPROVED
  - CANON_APPROVED
  - FINAL
  success_states:
  - APPROVED
  - CANON_APPROVED
  - FINAL
  rejection_states:
  - CANON_CONFLICT
  - EMOTIONAL_MANIPULATION
  - WORLD_RULES_FAILURE
  - FACE_IDENTITY_FAILURE
  - VISUAL_REJECTED
  - SOUND_BIOME_FAILURE
  - CONTINUITY_FAILURE
  - KDP_VALIDATION_FAILURE
  - CAPABILITY_BLOCKER
  - DYSTOPIA_CONTAMINATION
  - PARENTAL_GUILT_FAILURE
  - COUNTER_LOGIC_FAILURE
  - CHILD_VOICE_FAILURE
  - COFFEE_MOTIF_UNDERDEVELOPED
  locks:
    CANON_WRITE:
      mode: EXCLUSIVE
    STORY_BIBLE_WRITE:
      mode: EXCLUSIVE
    CHARACTER_BIBLE_WRITE:
      mode: EXCLUSIVE
    TIMELINE_WRITE:
      mode: EXCLUSIVE
    MANUSCRIPT_FINAL_WRITE:
      mode: EXCLUSIVE
    MANUSCRIPT_MERGE:
      mode: EXCLUSIVE
    FACE_CANON_WRITE:
      mode: EXCLUSIVE
    DOCX_BUILD:
      mode: EXCLUSIVE
    DELIVERY_BUILD:
      mode: EXCLUSIVE
  agents:
