  tasks:
  - id: T000_INITIALIZE_RUNTIME
    phase: BOOTSTRAP
    owner: MASTER_ORCHESTRATOR
    depends_on: []
    outputs:
    - /project_state/PROJECT_STATUS.yaml
    - /logs/ORCHESTRATION_LOG.md
    - /integration/MERGE_LOG.md
  - id: T001_VALIDATE_CAPABILITIES
    phase: BOOTSTRAP
    owner: SPEC_ARCHITECT
    depends_on:
    - T000_INITIALIZE_RUNTIME
    outputs:
    - /project_state/CAPABILITY_STATUS.yaml
  - id: T002_REGISTER_AGENTS
    phase: BOOTSTRAP
    owner: MASTER_ORCHESTRATOR
    depends_on:
    - T000_INITIALIZE_RUNTIME
    outputs:
    - /project_state/AGENT_REGISTRY.yaml
  - id: T010_MASTER_BRIEF
    phase: CANON
    owner: BRIEFING_ARCHITECT
    depends_on:
    - GATE_BOOTSTRAP
    inputs:
    - /book/CREATIVE_BRIEF.md
    - /book/BOOK_CONSTITUTION.md
    outputs:
    - /specs/MASTER_BRIEF.md
  - id: T011_STORY_BIBLE
    phase: CANON
    owner: NARRATIVE_ARCHITECT
    depends_on:
    - T010_MASTER_BRIEF
    locks:
    - STORY_BIBLE_WRITE
    inputs:
    - /book/chapter_architecture.yaml
    outputs:
    - /specs/STORY_BIBLE.md
  - id: T012_WORLD_RULES
    phase: CANON
    owner: WORLD_ARCHITECT
    depends_on:
    - T010_MASTER_BRIEF
    inputs:
    - /book/seeds/COUNTER_RULES_SEED.md
    outputs:
    - /specs/WORLD_RULES.md
  - id: T013_CHARACTER_BIBLE
    phase: CANON
    owner: CHARACTER_PSYCHOLOGIST
    depends_on:
    - T011_STORY_BIBLE
    locks:
    - CHARACTER_BIBLE_WRITE
    spawn:
      mode: PARALLEL_SUBAGENTS
      agents:
      - PARENTING_RELATIONSHIP_EXPERT
      - CHILD_VOICE_GUARDIAN
      - MEMORY_NOSTALGIA_EXPERT
      wait_for_all: true
    outputs:
    - /specs/CHARACTER_BIBLE.md
  - id: T014_WORLD_BIBLE
    phase: CANON
    owner: WORLD_ARCHITECT
    depends_on:
    - T011_STORY_BIBLE
    - T012_WORLD_RULES
    outputs:
