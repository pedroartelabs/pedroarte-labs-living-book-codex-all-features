  protocols:
    BASE_WAVE_REVIEW_PROTOCOL:
      reviewer_policy:
        manuscript_write: FORBIDDEN
        report_write: REQUIRED
      severity:
      - INFO
      - LOW
      - MEDIUM
      - HIGH
      - BLOCKER
      report_schema:
        finding_id: REQUIRED
        chapter: REQUIRED
        severity: REQUIRED
        category: REQUIRED
        evidence: REQUIRED
        recommended_action: REQUIRED
      review_synthesis:
        owner: EXECUTIVE_EDITOR
      revision_owner:
        agent: LEAD_NOVELIST
      final_approval:
        agent: EXECUTIVE_EDITOR
    PROTECTED_SCENE_PROTOCOL:
      owner: PROTECTED_SCENE_AUDITOR
      blocking: true
      criteria_source: /book/protected_scenes.yaml
    CANON_PROPOSAL_PROTOCOL:
      proposal_location: CANON_PROPOSALS
      mutation_owner: CANON_GUARDIAN
      unapproved_facts_are_canon: false
  quality_defaults:
    chapter_scores:
      authenticity_of_characters: 8
      scene_strength: 7
      subtext: 7
      sensory_concreteness: 7
      coherence: 8
      emotional_impact: 7
    risk_maximums:
      sentimentalism: 6
      effect_phrase_overuse: 5
      abstraction: 6
      continuity: 2
  quality_profile:
    apiVersion: pedroarte.livingbooks/v1
    kind: BookQualityProfile
    chapter_scores:
      authenticity_of_characters:
        minimum: 8
      scene_strength:
        minimum: 7
      subtext:
        minimum: 7
      sensory_concreteness:
        minimum: 7
      coherence:
        minimum: 8
      child_voice:
        minimum_when_applicable: 8
      speculative_hope:
        minimum: 8
      emotional_impact:
        minimum: 7
    risk_scores:
      dystopia:
        maximum: 2
      sentimentalism:
        maximum: 5
      destructive_parental_guilt:
        maximum: 3
      counter_overuse:
        maximum: 4
      effect_phrase_overuse:
        maximum: 4
      abstraction:
        maximum: 5
  immutable_rules:
    apiVersion: pedroarte.livingbooks/v1
    kind: ImmutableRules
    rules:
    - id: IMMUTABLE_001
      rule: The book contains exactly 30 chapters.
    - id: IMMUTABLE_002
      rule: Children cannot see counters.
    - id: IMMUTABLE_003
      rule: Counters never predict death, disease, accidents or tragedy.
    - id: IMMUTABLE_004
      rule: Forced behavior does not alter a counter.
    - id: IMMUTABLE_005
      rule: The counter phenomenon is never definitively explained.
    - id: IMMUTABLE_006
      rule: The novel must not become dystopian.
    - id: IMMUTABLE_007
      rule: Growth must also be depicted as achievement and new beginning.
    - id: IMMUTABLE_008
      rule: Mateus never sees the final carry counter reach zero.
    - id: IMMUTABLE_009
      rule: No epilogue follows chapter 30.
    - id: IMMUTABLE_010
      rule: 'The final manuscript sentence is exactly: Quando Mateus voltou, o café estava frio.'
    - id: IMMUTABLE_011
      rule: Exactly one approved primary editorial image exists per chapter.
    - id: IMMUTABLE_012
      rule: Recurring characters preserve canonical facial identity.
    - id: IMMUTABLE_013
      rule: Living Sound is physiological, not generic background music.
    - id: IMMUTABLE_014
      rule: Literature has precedence over viral marketing.
    - id: IMMUTABLE_015
      rule: The story must show rather than teach.
  custom_validators:
  - id: COUNTER_RULES
    command: python book/validators/validate_book_rules.py counter-rules
    phases:
    - canon
    - manuscript
  - id: COUNTER_DISTRIBUTION
    command: python book/validators/validate_book_rules.py counter-distribution
    phases:
    - briefs
    - manuscript
  - id: FINAL_LINE
    command: python book/validators/validate_book_rules.py final-line
    phases:
    - manuscript
    - kdp
    - delivery
